; FrankenPHP php.ini for Waaseyaa.
;
; Point the embedded PHP at THIS directory via the PHPRC environment variable
; when launching FrankenPHP natively, so these settings apply with no
; hand-editing:
;
;     PHPRC="$PWD/config/frankenphp" frankenphp run --config config/frankenphp/Caddyfile
;
; Why this file exists: Waaseyaa defaults to a SQLite database
; (storage/waaseyaa.sqlite), so the PHP runtime MUST have pdo_sqlite + sqlite3.
;
; The `extension=` lines below are COMMENTED OUT by default. Almost every
; FrankenPHP binary — and in particular the official statically-built
; Windows/Linux releases — has pdo_sqlite + sqlite3 compiled in. On those builds
; a bare `extension=pdo_sqlite` is NOT a harmless "module already loaded"
; warning: it makes PHP try to dynamically load a module that has no
; extension_dir to load from, and the pdo_sqlite DRIVER ends up unregistered.
; Every request then 500s with "could not find driver" out of
; DBALDatabase::createSqlite(). Relying on the bundled extensions (as the
; classic `composer serve:franken` path already does) is the working default.
;
; Only uncomment these if your runtime genuinely LACKS the extensions (a custom
; build without sqlite), and make sure `extension_dir` points at the directory
; that actually contains the .so/.dll modules.
; extension=pdo_sqlite
; extension=sqlite3

; Stream Server-Sent Events (/api/broadcast) to the client immediately. Output
; buffering would hold SSE frames and defeat the realtime admin updates.
output_buffering = Off
implicit_flush = On

; Surface boot errors during local development.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
