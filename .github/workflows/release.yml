name: Release Readiness

# This workflow verifies an exact Framework candidate. It deliberately has no
# GitHub Environment, deployment permission, artifact-promotion transport,
# rollback, or publication authority. Application deployment belongs to
# consumer/infra repositories; Framework publication remains owned by
# release-cut.yml.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-char SHA to verify (on main, or a release-cut/* gate tip)
        required: true
        type: string

concurrency:
  group: release-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-readiness-request:
    name: Validate explicit readiness request
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate exact main SHA
        id: validate
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be an exact lowercase 40-character commit SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          # Also fetch the release-cut gate namespace. release-cut.yml builds
          # its release commit on release-cut/<version> and gates it BEFORE
          # advancing main, so a candidate that is legitimately under test is
          # by definition not yet reachable from main. Requiring main
          # reachability made this workflow unable to verify the one commit it
          # most needs to verify: the exact commit about to be tagged.
          git fetch --no-tags origin '+refs/heads/release-cut/*:refs/remotes/origin/release-cut/*' || true
          git cat-file -e "$CANDIDATE_SHA^{commit}"

          if git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main; then
            echo "::notice::Candidate $CANDIDATE_SHA is reachable from origin/main."
          elif git for-each-ref --format='%(objectname)' 'refs/remotes/origin/release-cut/*' \
               | grep -qx "$CANDIDATE_SHA"; then
            # Deliberately narrow: only the TIP of a release-cut/* branch, a
            # namespace created solely by release-cut.yml and deleted on the way
            # out. An arbitrary unmerged commit is still refused.
            echo "::notice::Candidate $CANDIDATE_SHA is a release-cut gate-branch tip."
          else
            echo "::error::candidate SHA must be reachable from origin/main or be the tip of a release-cut/* gate branch"
            exit 1
          fi
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  build-release-candidate:
    name: Build exact release candidate
    runs-on: ubuntu-24.04
    needs: [validate-readiness-request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The validated output, not the raw input: validate-readiness-request
          # is the job that proves this SHA exists and is an accepted candidate.
          ref: ${{ needs.validate-readiness-request.outputs.candidate_sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Build candidate without deployment side effects
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: bash scripts/build-release-candidate.sh

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-evidence
          path: build/release/
          retention-days: 90

  playwright-full-sweep:
    name: Full Playwright release-readiness sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [validate-readiness-request, build-release-candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The validated output, not the raw input: validate-readiness-request
          # is the job that proves this SHA exists and is an accepted candidate.
          ref: ${{ needs.validate-readiness-request.outputs.candidate_sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install-retry
        with:
          args: '--no-interaction --prefer-dist --no-progress'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Install Node dependencies
        timeout-minutes: 5
        run: cd packages/admin && npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: cd packages/admin && npx playwright install chromium

      - name: Start PHP backend
        run: |
          php -S 127.0.0.1:8080 -t public/ > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run full Playwright suite
        run: cd packages/admin && npx playwright test --project=chromium

      - name: Summarize Playwright retries
        if: always()
        run: cd packages/admin && npm run test:e2e:summary

      - name: Upload Playwright evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-readiness-playwright
          path: |
            packages/admin/test-results/
            packages/admin/playwright-report/
          retention-days: 90

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-readiness-server-logs
          path: /tmp/php-server.log
          retention-days: 7
