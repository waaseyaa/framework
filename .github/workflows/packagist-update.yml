name: Verify Packagist Publication (standalone)

# STANDALONE VERIFIER — this workflow never submits anything.
#
# Named "Publish to Packagist" until alpha.285, which was actively misleading:
# an operator reading a failed run reasonably concluded publication had been
# attempted here, when submission actually happens in split.yml's
# `publish-packagist` job. The `package_filter` input said "update" for the
# same reason. Both are corrected.
#
# The release path no longer depends on this workflow at all: verification is
# now a job INSIDE split.yml (`verify-packagist`), so it cannot race the
# GitHub Release. This remains for ad-hoc checks — "is alpha.281 still fully
# installable?" — and for re-checking after a recovery run.
#
# Verifies every `waaseyaa/*` package (monorepo + split packages, discovered
# dynamically from `packages/*/composer.json` so the matrix can't drift) is
# published to Packagist after a release tag.
#
# Crawling is triggered by the `publish-packagist` job in split.yml: exactly ONE
# idempotent `POST /api/update-package` per package, gated on split + tag-parity
# + require-parity success. Packagist's GitHub auto-update PUSH webhooks are
# DISABLED on the monorepo + every split repo — they fired once per pushed ref
# (gate-branch + main + tag + gate-delete on the monorepo; main + tag on each
# split repo), re-crawling and re-publishing the just-cut version 2-3x per
# release (audit alpha.245 §1). With webhooks off, the single update-package
# POST is the only crawl trigger, so each package publishes exactly once.
# This workflow now only VERIFIES that result. See docs/VERSIONING.md §8.
#
# Jobs:
#   - discover: enumerate waaseyaa/* package names
#   - verify: poll the p2 endpoint until the just-cut tag is visible per package
#
# `verify` will stay red if Packagist's crawl is stalled (e.g. the 2026-04-15
# outage where it accepts jobs but does not crawl). That's the intended signal —
# when Packagist is healthy this turns green automatically.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (e.g. v0.1.0-alpha.169). Defaults to current ref.'
        required: false
        default: ''
      package_filter:
        description: 'Only VERIFY packages whose name CONTAINS this substring. Empty = all. (This workflow never submits an update.)'
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scan.outputs.packages }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      # Pinned to github.sha so the tag-push trigger always reads the
      # tagged commit's packages/*/composer.json (#1934). This is safe on
      # workflow_dispatch too: github.sha there resolves to the HEAD of
      # whichever ref the dispatch was run against, so the pin never breaks
      # manual runs — it just documents/guarantees the same checkout ref
      # the default behavior would have used anyway.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve target tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\. ]]; then
            echo "::error::Resolved tag '$tag' does not look like a release tag (expected vX.Y.Z[-...])"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Target tag: $tag"

      - name: Discover waaseyaa/* packages
        id: scan
        env:
          FILTER: ${{ inputs.package_filter }}
        run: |
          # Collect package names from every packages/*/composer.json plus
          # the monorepo composer.json. Filter to waaseyaa/* and de-dup.
          {
            for f in packages/*/composer.json; do
              jq -r '.name // empty' "$f"
            done
            jq -r '.name // empty' composer.json
          } | grep '^waaseyaa/' | sort -u > /tmp/all-pkgs.txt

          if [[ -n "$FILTER" ]]; then
            grep -F "$FILTER" /tmp/all-pkgs.txt > /tmp/pkgs.txt || true
          else
            cp /tmp/all-pkgs.txt /tmp/pkgs.txt
          fi

          count=$(wc -l < /tmp/pkgs.txt)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No packages matched filter '$FILTER'"
            exit 1
          fi
          echo "Will publish $count package(s):"
          cat /tmp/pkgs.txt

          json=$(jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/pkgs.txt)
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  verify:
    needs: [discover]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Wait for ${{ needs.discover.outputs.tag }} on ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: |
          # Poll p2 (composer's metadata endpoint) for up to 24 * 30s = 12 min.
          attempt=1
          max_attempts=24
          while [[ $attempt -le $max_attempts ]]; do
            body=$(curl -sS --max-time 15 "https://repo.packagist.org/p2/${PACKAGE}.json" || echo '{}')
            versions=$(echo "$body" | jq -r --arg pkg "$PACKAGE" '.packages[$pkg][]?.version // empty' 2>/dev/null || true)
            if echo "$versions" | grep -qFx "$TAG"; then
              echo "::notice::$PACKAGE $TAG visible on Packagist (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: $TAG not yet listed for $PACKAGE"
            attempt=$((attempt + 1))
            sleep 30
          done
          echo "::error::$PACKAGE $TAG not visible on Packagist after $((max_attempts * 30))s — Packagist crawl may be stalled"
          exit 1
