name: Split Monorepo

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-ci-green:
    name: Verify tagged SHA has green CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require a successful CI workflow run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # A tag push starts a fresh CI run at the same SHA. Poll through that
        # run instead of racing it in single-check mode.
        run: bash bin/wait-for-green-ci "${SHA}" 2700

  split:
    needs: verify-ci-green
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          # Layer 0: Foundation
          - { local: 'packages/foundation', remote: 'foundation' }
          - { local: 'packages/cache', remote: 'cache' }
          - { local: 'packages/plugin', remote: 'plugin' }
          - { local: 'packages/typed-data', remote: 'typed-data' }
          - { local: 'packages/database-legacy', remote: 'database-legacy' }
          - { local: 'packages/debug', remote: 'debug' }
          - { local: 'packages/error-handler', remote: 'error-handler' }
          - { local: 'packages/testing', remote: 'testing' }
          - { local: 'packages/i18n', remote: 'i18n' }
          - { local: 'packages/queue', remote: 'queue' }
          - { local: 'packages/state', remote: 'state' }
          - { local: 'packages/validation', remote: 'validation' }
          - { local: 'packages/mail', remote: 'mail' }
          - { local: 'packages/http-client', remote: 'http-client' }
          - { local: 'packages/github', remote: 'github' }
          - { local: 'packages/ingestion', remote: 'ingestion' }
          - { local: 'packages/deployer', remote: 'deployer' }
          # Layer 1: Core Data
          - { local: 'packages/entity', remote: 'entity' }
          - { local: 'packages/entity-storage', remote: 'entity-storage' }
          - { local: 'packages/access', remote: 'access' }
          - { local: 'packages/audit', remote: 'audit' }
          - { local: 'packages/user', remote: 'user' }
          - { local: 'packages/config', remote: 'config' }
          - { local: 'packages/field', remote: 'field' }
          - { local: 'packages/oidc', remote: 'oidc' }
          # Layer 2: Content Types
          - { local: 'packages/node', remote: 'node' }
          - { local: 'packages/attachment', remote: 'attachment' }
          - { local: 'packages/taxonomy', remote: 'taxonomy' }
          - { local: 'packages/media', remote: 'media' }
          - { local: 'packages/path', remote: 'path' }
          - { local: 'packages/menu', remote: 'menu' }
          - { local: 'packages/northcloud', remote: 'northcloud' }
          - { local: 'packages/note', remote: 'note' }
          - { local: 'packages/relationship', remote: 'relationship' }
          - { local: 'packages/groups', remote: 'groups' }
          # Layer 2: Services
          - { local: 'packages/auth', remote: 'auth' }
          - { local: 'packages/billing', remote: 'billing' }
          - { local: 'packages/bimaaji', remote: 'bimaaji' }
          # Layer 3: Services
          - { local: 'packages/listing', remote: 'listing' }
          - { local: 'packages/publishing', remote: 'publishing' }
          - { local: 'packages/migration', remote: 'migration' }
          - { local: 'packages/search', remote: 'search' }
          - { local: 'packages/seo', remote: 'seo' }
          - { local: 'packages/structured-import', remote: 'structured-import' }
          - { local: 'packages/workflows', remote: 'workflows' }
          # Layer 4: API
          - { local: 'packages/api', remote: 'api' }
          - { local: 'packages/routing', remote: 'routing' }
          - { local: 'packages/wayfinding', remote: 'wayfinding' }
          # Layer 5: AI
          - { local: 'packages/ai-schema', remote: 'ai-schema' }
          - { local: 'packages/ai-agent', remote: 'ai-agent' }
          - { local: 'packages/ai-pipeline', remote: 'ai-pipeline' }
          - { local: 'packages/ai-vector', remote: 'ai-vector' }
          - { local: 'packages/ai-observability', remote: 'ai-observability' }
          - { local: 'packages/ai-tools', remote: 'ai-tools' }
          # Layer 5.5: GraphQL
          - { local: 'packages/graphql', remote: 'graphql' }
          # Layer 6: Interfaces
          - { local: 'packages/cli', remote: 'cli' }
          - { local: 'packages/frankenphp', remote: 'frankenphp' }
          - { local: 'packages/genealogy', remote: 'genealogy' }
          - { local: 'packages/inertia', remote: 'inertia' }
          - { local: 'packages/mcp', remote: 'mcp' }
          - { local: 'packages/ssr', remote: 'ssr' }
          - { local: 'packages/telescope', remote: 'telescope' }
          - { local: 'packages/admin-surface', remote: 'admin-surface' }
          - { local: 'packages/workspace', remote: 'workspace' }
          # Split parity — packages with composer.json that were missing from the matrix (#1137)
          - { local: 'packages/analytics', remote: 'analytics' }
          - { local: 'packages/engagement', remote: 'engagement' }
          - { local: 'packages/geo', remote: 'geo' }
          - { local: 'packages/mercure', remote: 'mercure' }
          - { local: 'packages/messaging', remote: 'messaging' }
          - { local: 'packages/notification', remote: 'notification' }
          - { local: 'packages/oauth-provider', remote: 'oauth-provider' }
          - { local: 'packages/scheduler', remote: 'scheduler' }
          # Meta-packages
          - { local: 'packages/cms', remote: 'cms' }
          - { local: 'packages/core', remote: 'core' }
          - { local: 'packages/full', remote: 'full' }
          # NOTE: the project skeleton (waaseyaa/waaseyaa) is intentionally NOT
          # split here. It is owned solely by sync-skeleton.yml, which rsyncs
          # the skeleton tree, pins waaseyaa/framework to the release tag, tags
          # and publishes it. A subtree-split entry here produced a different
          # SHA and an unpinned manifest, then collided with sync-skeleton's tag
          # (RETAG_BLOCKED) and skipped the entire publish stage (alpha.246).
          # The RP106 guard in bin/check-release-publish-shape enforces this.

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install splitsh-lite
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "${archive}"' EXIT
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz
          # SHA-256 recorded from the immutable upstream v1.0.1 GitHub release asset.
          printf '%s  %s\n' \
            '2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc' \
            "${archive}" | sha256sum --check
          tar -xzf "${archive}"
          sudo mv splitsh-lite /usr/local/bin/splitsh-lite

      - name: Guard against unauthorized v1.0 tag
        if: startsWith(github.ref_name, 'v1.0')
        run: |
          if [ ! -f "release-approvals/v1.0.approved" ]; then
            echo "::error::UNAUTHORIZED_V1_TAG: Monorepo split aborted."
            echo "::error::A v1.0 tag was pushed without owner approval. See VERSIONING.md."
            exit 1
          fi
          echo "v1.0 approval artifact verified. Proceeding with split."

      - name: Verify split token
        env:
          SPLIT_GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: |
          if [ -z "${SPLIT_GH_TOKEN}" ]; then
            echo "::error::SPLIT_GITHUB_TOKEN secret is empty or not set."
            exit 1
          fi
          echo "SPLIT_GITHUB_TOKEN is configured."

      - name: Guard against monorepo self-split
        env:
          REMOTE_REPO: ${{ matrix.package.remote }}
          MONOREPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "${REMOTE_REPO}" = "${MONOREPO_NAME}" ]; then
            echo "::error::Self-split blocked: matrix entry remote='${REMOTE_REPO}' equals this monorepo's repo name."
            echo "::error::Pushing this split target would force-overwrite the monorepo's own main branch."
            echo "::error::Rename the remote (e.g. '${REMOTE_REPO}-meta') or drop the entry."
            exit 1
          fi

      - name: Split and push
        env:
          SPLIT_GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
          LOCAL_PREFIX: ${{ matrix.package.local }}
          REMOTE_REPO: ${{ matrix.package.remote }}
          REPO_OWNER: ${{ github.repository_owner }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          REMOTE_URL="https://x-access-token:${SPLIT_GH_TOKEN}@github.com/${REPO_OWNER}/${REMOTE_REPO}.git"
          SHA=$(splitsh-lite --prefix="${LOCAL_PREFIX}")
          git remote add split "${REMOTE_URL}" 2>/dev/null || true
          git push split "${SHA}:refs/heads/main" --force
          # Forward-only: push the release tag NON-FORCE. Packagist treats tag
          # versions as immutable; force-moving a tag would diverge git from
          # Packagist (the old dist stays published). If the split repo already
          # has this tag at a DIFFERENT sha, that is a re-tag attempt — fail
          # loudly (RETAG_BLOCKED). Re-pushing the SAME sha is an idempotent
          # no-op (safe on re-runs). Recover a bad release by cutting
          # alpha.N+1, never by re-tagging. See docs/VERSIONING.md §8.
          if ! git push split "${SHA}:refs/tags/${TAG_NAME}"; then
            existing="$(git ls-remote --tags split "refs/tags/${TAG_NAME}" | awk '{print $1}')"
            if [ -n "${existing}" ] && [ "${existing}" != "${SHA}" ]; then
              echo "::error::RETAG_BLOCKED: ${REMOTE_REPO} already has tag ${TAG_NAME} at ${existing}; refusing to move it to ${SHA}. Releases are forward-only — cut alpha.N+1 instead of re-tagging."
            else
              echo "::error::Tag push of ${TAG_NAME} to ${REMOTE_REPO} failed."
            fi
            exit 1
          fi

  verify-monorepo-main-intact:
    name: Verify the tagged commit is still reachable from monorepo main
    needs: split
    runs-on: ubuntu-latest
    steps:
      # This does NOT require main == github.sha. Legitimate PRs can merge to
      # main while the split fan-out for this tag is still running (main only
      # moves forward — "ahead"/"identical" are fine). What must NEVER happen
      # is the tagged commit falling off main's history ("behind"/"diverged"),
      # which only happens if a split target force-overwrote this monorepo's
      # own main (self-split collision) and rewrote it out from under the tag.
      # See #1934 — alpha.257 false-failed here on a same-day forward merge.
      - name: Assert tagged SHA is still an ancestor of main
        env:
          MONOREPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          compare_status=$(gh api "repos/${MONOREPO}/compare/${EXPECTED_SHA}...main" --jq '.status')
          case "${compare_status}" in
            identical|ahead)
              echo "OK — tagged commit ${EXPECTED_SHA} is still an ancestor of main (status: ${compare_status})."
              ;;
            *)
              echo "::error::Monorepo main no longer contains the tagged commit!"
              echo "::error::Expected ${EXPECTED_SHA} to be an ancestor of main; compare status was '${compare_status}'."
              echo "::error::A split target likely collided with this monorepo's repo name and force-overwrote main."
              exit 1
              ;;
          esac

  verify-tag-parity:
    needs: split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify split tag parity across package repos
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: |
          bash bin/check-release-tag-parity "${TAG_NAME}"

  verify-require-parity:
    # Defense-in-depth mirror of the pre-tag gate in release-cut.yml. Catches a
    # poisoned root manifest if a tag was pushed by a path that bypasses
    # release-cut (e.g. a manual `git push --tags`). Companion to the
    # tag-parity check above: tag-parity verifies the tag propagated to every
    # split repo; require-parity verifies every root waaseyaa/* require has a
    # split target + existing repo in the first place.
    needs: split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify root require / split parity
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: bash bin/check-release-require-parity

  # Stage 4 of the release state machine: split tags -> verify split parity ->
  # submit Packagist updates -> VERIFY 76/76 -> publish GitHub Release.
  #
  # This lived in a separate workflow (`packagist-update.yml`) that ran on the
  # same tag push, so the two raced: the release could publish while
  # verification was still polling, and stayed published when it failed.
  # Inlining it makes the ordering a dependency rather than a coincidence.
  #
  # The window is deliberately generous. At alpha.285 three packages were
  # reported missing after ~12 minutes of polling and then appeared on their
  # own — they were queued and slow, not dropped, and the old 24-attempt
  # ceiling could not tell those apart. Observed wait is recorded so the real
  # latency distribution becomes visible instead of guessed at.
  verify-packagist:
    name: Verify every package is installable
    needs: [publish-packagist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Poll P2 until every package lists the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          UA='waaseyaa-release/1.0 (+https://github.com/waaseyaa/framework; release verification)'

          {
            for f in packages/*/composer.json; do jq -r '.name // empty' "$f"; done
            jq -r '.name // empty' composer.json
          } | grep '^waaseyaa/' | sort -u > /tmp/pkgs.txt
          total=$(wc -l < /tmp/pkgs.txt)
          echo "Verifying ${total} package(s) at ${TAG}."

          deadline=$(( $(date +%s) + 2400 ))   # 40 minutes
          missing_file=/tmp/missing.txt
          cp /tmp/pkgs.txt "${missing_file}"
          start=$(date +%s)

          while [ -s "${missing_file}" ] && [ "$(date +%s)" -lt "${deadline}" ]; do
            : > /tmp/still-missing.txt
            while IFS= read -r pkg; do
              [ -z "${pkg}" ] && continue
              if curl -sS -A "${UA}" "https://repo.packagist.org/p2/${pkg}.json" \
                   | jq -e --arg t "${TAG}" '.packages[][] | select(.version == $t)' >/dev/null 2>&1; then
                echo "::notice::${pkg}: visible after $(( $(date +%s) - start ))s."
              else
                echo "${pkg}" >> /tmp/still-missing.txt
              fi
            done < "${missing_file}"
            mv /tmp/still-missing.txt "${missing_file}"
            [ -s "${missing_file}" ] || break
            echo "$(wc -l < "${missing_file}") still pending after $(( $(date +%s) - start ))s; waiting."
            sleep $(( 45 + RANDOM % 30 ))
          done

          elapsed=$(( $(date +%s) - start ))

          if [ -s "${missing_file}" ]; then
            list=$(paste -sd, "${missing_file}")
            {
              echo "## Packagist verification FAILED after ${elapsed}s"
              echo
              echo '```json'
              jq -R -s -c 'split("\n") | map(select(length > 0)) | {missing: .}' < "${missing_file}"
              echo '```'
              echo
              echo "Recover only these packages, without republishing the rest:"
              echo
              echo '```'
              echo "gh workflow run packagist-recover.yml -f packages=${list} -f tag=${TAG}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Not installable at ${TAG}: ${list}"
            echo "::error::Recover: gh workflow run packagist-recover.yml -f packages=${list} -f tag=${TAG}"
            exit 1
          fi

          echo "## Packagist verification passed" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "All ${total} packages installable at \`${TAG}\` after ${elapsed}s." >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::All ${total} packages visible at ${TAG} after ${elapsed}s."

  # Publish only after split matrix + monorepo integrity + parity + PACKAGIST
  # VERIFICATION — avoids racing github-release.yml on tag push, blocks releases
  # if main was overwritten, and (alpha.285) refuses to announce a release whose
  # packages a consumer cannot yet install.
  #
  # `verify-packagist` was previously a separate workflow that raced this job:
  # the GitHub Release published while Packagist verification was still running,
  # and stayed published when it failed. A release note pointing at packages
  # that `composer require` cannot resolve is worse than a late release note.
  publish-github-release:
    name: Publish GitHub Release
    needs: [verify-monorepo-main-intact, verify-tag-parity, verify-require-parity, verify-packagist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  # Single-crawl publish (WP01, audit §1). Packagist's GitHub auto-update PUSH
  # webhooks are DISABLED on the monorepo + every split repo (they fired once
  # per pushed ref -> 2-3 crawls/republishes per release). Instead we trigger
  # EXACTLY ONE idempotent update-package POST per package, AFTER split + tag
  # parity + require parity succeed. This is the only crawl trigger, so each
  # package is published once per release. A 404 from update-package means the
  # package was never registered (first release of a new split package) — in
  # that case we fall back to create-package once, which registers + crawls it.
  # Requires repo secrets PACKAGIST_USERNAME + PACKAGIST_TOKEN.
  publish-packagist:
    name: Publish to Packagist (one crawl per package)
    needs: [split, verify-monorepo-main-intact, verify-tag-parity, verify-require-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Discover waaseyaa/* packages
        id: scan
        run: |
          {
            for f in packages/*/composer.json; do jq -r '.name // empty' "$f"; done
            jq -r '.name // empty' composer.json
          } | grep '^waaseyaa/' | sort -u > /tmp/pkgs.txt
          echo "Discovered $(wc -l < /tmp/pkgs.txt) package(s)."

      - name: Trigger exactly one Packagist crawl per package
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN secret not set."
            echo "::error::The Packagist push webhooks are disabled by design (single-crawl model),"
            echo "::error::so without these secrets nothing publishes. Configure them, then re-run."
            exit 1
          fi
          # Packagist asks API consumers to identify themselves.
          UA='waaseyaa-release/1.0 (+https://github.com/waaseyaa/framework; release fan-out)'

          rc=0
          n=0
          : > /tmp/packagist-jobs.txt
          while IFS= read -r pkg; do
            [ -z "${pkg}" ] && continue
            n=$(( n + 1 ))
            # Spacing between submissions (alpha.285). This loop previously
            # fired ~76 POSTs back to back; the three packages that took
            # longest to appear were the first three alphabetically, i.e. the
            # front of that burst. Jitter avoids synchronising with anything
            # else hitting the same endpoint.
            [ "${n}" -gt 1 ] && sleep $(( 3 + RANDOM % 4 ))
            # waaseyaa/<x> is registered on Packagist at github.com/<owner>/<x>
            # (each split package's own repo; the monorepo for waaseyaa/framework).
            repo_url="https://github.com/${REPO_OWNER}/${pkg#waaseyaa/}"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"repository\":{\"url\":\"${repo_url}\"}}" || echo "000")
            if [ "${code}" = "200" ] || [ "${code}" = "202" ]; then
              # ACCEPTED, NOT PUBLISHED. 202 means the crawl is queued. The
              # `verify-packagist` job below decides whether it actually
              # happened; this step must never be read as publication.
              #
              # The job id is recorded because without it a package that never
              # appears is indistinguishable from one still in the queue —
              # which is exactly what made the alpha.285 investigation guesswork.
              job_id=$(jq -r '.job // .jobs[0] // empty' /tmp/resp.json 2>/dev/null)
              printf '%s\t%s\t%s\n' "${pkg}" "${code}" "${job_id:-none}" >> /tmp/packagist-jobs.txt
              echo "::notice::${pkg}: update-package QUEUED (HTTP ${code}, job ${job_id:-none}) — not yet published."
            elif [ "${code}" = "404" ]; then
              # Package not yet registered on Packagist — first release of a new
              # split package (e.g. waaseyaa/publishing, alpha.277). Register it
              # via create-package with the same username/apiToken query-param
              # auth the update-package call above provably authenticates with
              # (the Bearer-header form from the apidoc example was rejected 406
              # "Missing or invalid username/apiToken" on the alpha.277 cut).
              # Payload is a plain-string repository URL per packagist.org/apidoc.
              # Idempotent by construction: once registered, the update-package
              # call above succeeds and this branch never runs.
              echo "::notice::${pkg}: not registered on Packagist yet — creating."
              ccode=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
                "https://packagist.org/api/create-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
                -H 'Content-Type: application/json' \
                -d "{\"repository\":\"${repo_url}\"}" || echo "000")
              if [ "${ccode}" = "200" ] || [ "${ccode}" = "202" ]; then
                echo "::notice::${pkg}: create-package accepted (HTTP ${ccode})."
              else
                echo "::error::${pkg}: create-package failed (HTTP ${ccode}): $(cat /tmp/create.json 2>/dev/null)"
                rc=1
              fi
            else
              echo "::error::${pkg}: update-package failed (HTTP ${code}): $(cat /tmp/resp.json 2>/dev/null)"
              rc=1
            fi
          done < /tmp/pkgs.txt

          {
            echo "## Packagist crawl submissions"
            echo
            echo "Queued, **not** published — see the \`verify-packagist\` job."
            echo
            echo "| Package | HTTP | Job |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r pk co jb; do echo "| \`${pk}\` | ${co} | \`${jb}\` |"; done < /tmp/packagist-jobs.txt
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${rc}"
