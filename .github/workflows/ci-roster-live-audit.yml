name: CI roster live audit

on:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to audit; defaults to the selected ref
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  live-audit:
    name: CI roster live audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact audit target
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-${EVENT_SHA}}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Run live ruleset and check-run audit
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_SHA: ${{ steps.target.outputs.sha }}
        run: |
          mkdir -p ci-roster-live-audit
          php bin/audit-ci-roster-live \
            --repo="$GITHUB_REPOSITORY" \
            --sha="$AUDIT_SHA" \
            --output=ci-roster-live-audit/report.json \
            --snapshot-output=ci-roster-live-audit/ruleset-snapshot.json \
            2>&1 | tee ci-roster-live-audit/summary.txt

      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ci-roster-live-audit-${{ github.run_id }}
          path: ci-roster-live-audit/
          if-no-files-found: error
          retention-days: 30
