name: Sync Application Skeleton

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: framework

      - name: Checkout skeleton
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: waaseyaa/waaseyaa
          token: ${{ secrets.SPLIT_GITHUB_TOKEN }}
          path: skeleton

      - name: Sync skeleton files from monorepo
        run: |
          # Sync all files from framework/skeleton/ to the skeleton repo.
          # The skeleton intentionally has NO composer.lock — create-project
          # writes a fresh one per project. The monorepo stopped committing
          # one after the alpha.158-era lock went stale against the advancing
          # framework pin and broke ci/skeleton-create-project for three
          # releases (alpha.200–202). No exclude here: --delete purges any
          # stale lock still present in the published repo.
          rsync -av --delete \
            --exclude='.git' \
            framework/skeleton/ skeleton/

      - name: Update skeleton composer.json packages
        # Pin waaseyaa/framework to the tag being released so the published
        # skeleton never drifts behind the framework (issue #1622).
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          php framework/tools/sync-skeleton-requirements.php \
            framework/skeleton/composer.json \
            skeleton/composer.json \
            "${TAG_NAME}"

      - name: Validate synced skeleton manifest
        # Release gate: a malformed/inconsistent published skeleton manifest
        # fails the sync before it is tagged and pushed (issue #1599).
        run: composer validate --no-check-publish --no-check-lock skeleton/composer.json

      - name: Commit, tag, and push if changed
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd skeleton
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to skeleton"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync with framework ${TAG_NAME}"
          fi

          # Publish only a forward update. A release tag is immutable: a rerun
          # may confirm the same tag/SHA pair, but it must never retarget it.
          CURRENT_SHA="$(git rev-parse HEAD)"
          REMOTE_TAG_SHA="$(git ls-remote --refs origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
          if [ -n "$REMOTE_TAG_SHA" ] && [ "$REMOTE_TAG_SHA" != "$CURRENT_SHA" ]; then
            echo "::error::RETAG_BLOCKED: ${TAG_NAME} already points to ${REMOTE_TAG_SHA}, not ${CURRENT_SHA}."
            exit 1
          fi

          LOCAL_TAG_SHA="$(git rev-parse -q --verify "refs/tags/${TAG_NAME}^{commit}" || true)"
          if [ -n "$LOCAL_TAG_SHA" ] && [ "$LOCAL_TAG_SHA" != "$CURRENT_SHA" ]; then
            echo "::error::Local ${TAG_NAME} points to ${LOCAL_TAG_SHA}, not ${CURRENT_SHA}."
            exit 1
          fi
          if [ -z "$LOCAL_TAG_SHA" ]; then
            git tag "${TAG_NAME}"
          fi

          # Atomic publication prevents a main-only or tag-only partial sync.
          # A non-fast-forward main update or conflicting tag fails closed.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG_NAME}"

      - name: Publish skeleton to Packagist (one crawl)
        # sync-skeleton.yml is the SOLE owner of waaseyaa/waaseyaa: split.yml's
        # publish-packagist enumerates only packages/* + the root (never the
        # skeleton), and the Packagist push webhooks are disabled (single-crawl
        # model). So this workflow must trigger the skeleton's own single
        # idempotent update-package POST, or the skeleton silently stops
        # publishing. Mirrors split.yml's publish-packagist crawl shape.
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN secret not set."
            echo "::error::The Packagist push webhooks are disabled (single-crawl model),"
            echo "::error::so without these secrets the skeleton does not publish. Configure them, then re-run."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/waaseyaa/waaseyaa"}}' || echo "000")
          if [ "${code}" = "200" ] || [ "${code}" = "202" ]; then
            echo "::notice::waaseyaa/waaseyaa: update-package accepted (HTTP ${code})."
          else
            echo "::error::waaseyaa/waaseyaa: update-package failed (HTTP ${code}): $(cat /tmp/resp.json 2>/dev/null)"
            exit 1
          fi
