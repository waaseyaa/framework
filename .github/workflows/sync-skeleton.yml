name: Sync Application Skeleton

on:
  push:
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          path: framework

      - name: Checkout skeleton
        uses: actions/checkout@v7
        with:
          repository: waaseyaa/waaseyaa
          token: ${{ secrets.SPLIT_GITHUB_TOKEN }}
          path: skeleton

      - name: Sync skeleton files from monorepo
        run: |
          # Sync all files from framework/skeleton/ to the skeleton repo.
          # The skeleton intentionally has NO composer.lock — create-project
          # writes a fresh one per project. The monorepo stopped committing
          # one after the alpha.158-era lock went stale against the advancing
          # framework pin and broke ci/skeleton-create-project for three
          # releases (alpha.200–202). No exclude here: --delete purges any
          # stale lock still present in the published repo.
          rsync -av --delete \
            --exclude='.git' \
            framework/skeleton/ skeleton/

      - name: Update skeleton composer.json packages
        # Pin waaseyaa/framework to the tag being released so the published
        # skeleton never drifts behind the framework (issue #1622).
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          php framework/tools/sync-skeleton-requirements.php \
            framework/skeleton/composer.json \
            skeleton/composer.json \
            "${TAG_NAME}"

      - name: Validate synced skeleton manifest
        # Release gate: a malformed/inconsistent published skeleton manifest
        # fails the sync before it is tagged and pushed (issue #1599).
        run: composer validate --no-check-publish --no-check-lock skeleton/composer.json

      - name: Commit, tag, and push if changed
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd skeleton
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to skeleton"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync with framework ${TAG_NAME}"
          fi

          # Always tag to match the framework release
          git tag "${TAG_NAME}" -f
          git push origin main --tags --force
