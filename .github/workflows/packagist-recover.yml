name: Recover Packagist Publication

# Targeted recovery for packages that Packagist ACCEPTED but never CRAWLED.
#
# Why this exists (alpha.285): the former release submitter treated HTTP
# 200/202 as success and discarded the response body. A 202 means **queued,
# not published**, so three packages stayed on alpha.284 after an accepted job.
# The ordered release verifier correctly went red, but recovery still needed a
# bounded way to resubmit only the affected packages. The shared action now
# retains job ids while this workflow preserves that targeted recovery path.
#
# This workflow is that way. It is deliberately narrow: an explicit package
# list, an existing tag, one submission at a time, and success defined as **the
# exact tag appearing in P2 metadata** — never as an accepted POST.
#
# It does NOT cut a version, move a tag, or touch the monorepo.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package names to recover, e.g. waaseyaa/analytics,waaseyaa/attachment'
        required: true
        type: string
      tag:
        description: 'Existing release tag that must become visible, e.g. v0.1.0-alpha.285'
        required: true
        type: string
      max_attempts:
        description: 'Submission attempts per package before giving up'
        required: false
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Recover ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recover named packages
        uses: ./.github/actions/packagist-submit
        with:
          packages: ${{ inputs.packages }}
          repository-owner: ${{ github.repository_owner }}
          username: ${{ secrets.PACKAGIST_USERNAME }}
          token: ${{ secrets.PACKAGIST_TOKEN }}
          allow-create: false
          mode: recovery
          tag: ${{ inputs.tag }}
          github-token: ${{ github.token }}
          max-attempts: ${{ inputs.max_attempts }}
