name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  # Dispatched by release-cut.yml on its gate branch so the exact release
  # commit is CI-proven BEFORE the tag is created (red-at-tag fix, alpha.202
  # post-mortem). Manual dispatch on any ref is also fine. auto-merge.yml
  # chain-dispatches this workflow on the merge commit SHA after a bot-token
  # merge (which suppresses the push trigger) — see auto-merge.yml (#1937).
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA to check out (empty = tip of the dispatched ref)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  support-contract:
    name: support/s1-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify bounded S1 support contract
        run: php bin/check-support-contract --ci --evidence=support-contract-evidence.json

      # GitHub is a replaceable executor. This command and its repository
      # evidence are the portable topology gate.
      - name: Verify S1 SQLite topology contract
        run: php bin/check-s1-sqlite-contract --ci

      - name: Verify S1 configuration activation contract
        run: php bin/check-s1-configuration-activation

      - name: Verify S1 configuration authority contract
        run: php bin/check-s1-configuration-authority

      - name: Verify S1 schema authority contract
        run: php bin/check-s1-schema-authority

      - name: Publish exact environment evidence
        if: always()
        run: |
          if test -f support-contract-evidence.json; then
            cat support-contract-evidence.json
          else
            echo "support-contract evidence was not produced"
          fi

      - name: Upload exact environment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: support-contract-evidence-${{ inputs.sha || github.sha }}
          path: support-contract-evidence.json
          if-no-files-found: warn
          retention-days: 30

  release-pipeline-fixtures:
    name: Release pipeline fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      # Guards the decision logic that was wrong at alpha.285: an accepted POST
      # is not publication, and an existing package is not a published version.
      # No network, no credentials — canned P2 fixtures only.
      - name: Packagist verification fixtures
        run: bash tests/release/packagist-verification.bats.sh

  release-evidence:
    name: Deterministic release evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Generate and replay release evidence from synthetic split inputs
        env:
          RELEASE_EVIDENCE_DRY_RUN_OUTPUT: build/release-evidence
        run: node tests/Architecture/release-evidence-regression.mjs

      - name: Retain pull-request dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-dry-run-${{ github.sha }}
          path: build/release-evidence
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  composer-policy:
    name: composer-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-tags: true  # fetch-tags: required for CP-NEW (composer-internal-version-sweep WP03)

      - name: Enforce composer policy
        run: php bin/check-composer-policy

      - name: Enforce portable repository paths
        run: php bin/check-portable-paths

      - name: Enforce package layer graph
        run: php bin/check-package-layers

      - name: Audit require-dev layer graph (warn-only)
        run: bash bin/audit-require-dev-layers

  composer-deps-audit:
    name: composer-deps-audit (warn-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run composer-dependency audit (warn-only)
        run: bash bin/audit-composer-deps

  spec-drift:
    name: spec-drift
    # Doc-code coupling is a pull-request concern (like changelog-discipline):
    # it asks "did this PR update the spec alongside the source?". There is no
    # such question to ask on a post-merge push to main, so skip it there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check for stale specs
        if: github.event_name == 'pull_request'
        run: bash tools/drift-detector.sh "origin/${{ github.base_ref }}"

      - name: Skip PR-only coupling check
        if: github.event_name != 'pull_request'
        run: echo "spec-drift is a pull-request coupling check; no PR diff exists for this event."

  ci-lint:
    name: ci/lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer.json
        run: composer validate

      - name: Framework provenance (lockfile vs checkout SHA)
        env:
          WAASEYAA_GOLDEN_SHA: ${{ github.sha }}
        run: php -r "require 'vendor/autoload.php'; exit(Waaseyaa\\CLI\\Provenance\\ComposerProvenanceReporter::main(getcwd(), []));"

      - name: Check PHP syntax
        run: find packages/*/src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run CS Fixer (dry-run)
        run: composer cs-check

      - name: Restore PHPStan result cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/phpstan
          key: phpstan-result-cache-${{ github.run_id }}
          restore-keys: |
            phpstan-result-cache-

      - name: Run PHPStan
        run: composer phpstan

      - name: Save PHPStan result cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: tmp/phpstan
          key: phpstan-result-cache-${{ github.run_id }}

  check-dead-code:
    name: check-dead-code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Restore dead-code PHPStan result cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/phpstan-dead-code
          # Bust the cache when the analyzer's rules change: provider source,
          # dead-code config, or baseline. The run_id suffix gives per-run
          # write keys; the restore-keys fallback only matches runs with the
          # same analyzer-config hash, never older provider versions.
          key: phpstan-dead-code-cache-${{ hashFiles('tools/phpstan/WaaseyaaEntrypointProvider.php', 'phpstan-dead-code.neon', 'phpstan-dead-code-baseline.neon', 'phpstan.neon') }}-${{ github.run_id }}
          restore-keys: |
            phpstan-dead-code-cache-${{ hashFiles('tools/phpstan/WaaseyaaEntrypointProvider.php', 'phpstan-dead-code.neon', 'phpstan-dead-code-baseline.neon', 'phpstan.neon') }}-

      - name: Run dead-code check (fails on new findings)
        run: php bin/check-dead-code

      - name: Save dead-code PHPStan result cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: tmp/phpstan-dead-code
          key: phpstan-dead-code-cache-${{ hashFiles('tools/phpstan/WaaseyaaEntrypointProvider.php', 'phpstan-dead-code.neon', 'phpstan-dead-code-baseline.neon', 'phpstan.neon') }}-${{ github.run_id }}

  prepare-test-plan:
    name: Prepare timing-balanced PHPUnit plan
    runs-on: ubuntu-24.04
    needs: [support-contract, spec-drift]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-composer-

      # Single install authority (#2404 revision): every downstream test job
      # (ci-test-shards, ci-random-order-shard) consumes this exact-head
      # install as a run-scoped artifact instead of each running its own
      # `composer install` against codeload.github.com. Three CI reruns on
      # PR #2406 failed on repeated HTTP/2 429s from three independent
      # installs (this job, ci/test-shard-1, ci/skeleton-create-project) —
      # collapsing the first two into one authority removes two of the
      # three failure points outright.
      - name: Install dependencies (single authority for this run)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the run-scoped dependency archive
        run: |
          mkdir -p build/ci
          tar --create --file build/ci/vendor.tar vendor
          sha256sum build/ci/vendor.tar > build/ci/vendor.tar.sha256
          php -r '$h = hash_file("sha256", "vendor/composer/installed.php"); file_put_contents("build/ci/installed.sha256", $h . PHP_EOL);'

      - name: Build deterministic shard plan
        run: |
          mkdir -p build/ci
          php bin/build-phpunit-shards --shards=4 --timings=tools/phpunit-timings.json > build/ci/phpunit-shards.json
          php -r '$p = json_decode(file_get_contents("build/ci/phpunit-shards.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($p["include"] as $s) { printf("shard %d: %d files, %.2fs recorded, %d fallback%s", $s["id"], $s["test_files"], $s["expected_seconds"], $s["fallback_files"], PHP_EOL); }'

      - name: Retain exact shard plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-shard-plan
          path: build/ci/phpunit-shards.json
          retention-days: 30

      # Consumed by both ci-test-shards and ci-random-order-shard via
      # bin/verify-random-order-vendor-archive, with a locked `composer
      # install` fallback on verification failure in each consumer.
      - name: Retain the run-scoped dependency archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-archive
          path: |
            build/ci/vendor.tar
            build/ci/vendor.tar.sha256
            build/ci/installed.sha256
          if-no-files-found: error
          retention-days: 30

  ci-test-shards:
    name: ci/test-shard-${{ matrix.id }}
    runs-on: ubuntu-24.04
    needs: [support-contract, spec-drift, prepare-test-plan]
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: pcov

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-composer-

      - name: Download the run-scoped dependency archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-archive
          path: build/ci

      # Same fail-closed integrity gate ci-random-order-shard uses: a
      # wrong-head or tampered archive is discarded, never trusted, and the
      # job falls back to a locked `composer install` rather than force
      # artifact use. See bin/verify-random-order-vendor-archive for the
      # digest/extraction/symlink checks (fixture-tested in
      # tests/Architecture/RandomOrderVendorArchiveIntegrityTest.php).
      - name: Restore dependencies with integrity proof
        run: |
          set -euo pipefail
          restore_failed=0
          bin/verify-random-order-vendor-archive build/ci . || restore_failed=1
          if test "$restore_failed" -eq 0; then
            composer check-platform-reqs --no-interaction || restore_failed=1
          fi
          if test "$restore_failed" -ne 0; then
            echo "::warning title=Dependency archive rejected::falling back to a locked install"
            rm -rf vendor
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Download exact shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phpunit-shard-plan
          path: build/ci

      - name: Execute shard once with test and coverage evidence
        env:
          SHARD_ID: ${{ matrix.id }}
        run: |
          mkdir -p build/logs
          php -r '$p = json_decode(file_get_contents("build/ci/phpunit-shards.json"), true, 512, JSON_THROW_ON_ERROR); $id = (int) getenv("SHARD_ID"); foreach ($p["include"] as $s) { if ($s["id"] === $id) { file_put_contents("build/ci/test-paths", $s["paths"] . PHP_EOL); exit(0); } } fwrite(STDERR, "Shard id is absent from the exact plan." . PHP_EOL); exit(2);'
          mapfile -t test_paths < build/ci/test-paths
          test "${#test_paths[@]}" -gt 0
          php -d memory_limit=1G vendor/bin/phpunit "${test_paths[@]}" \
            --coverage-clover build/logs/clover-${{ matrix.id }}.xml \
            --log-junit build/logs/junit-${{ matrix.id }}.xml

      - name: Upload shard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: php-test-shard-${{ matrix.id }}
          path: |
            build/logs/junit-${{ matrix.id }}.xml
            build/logs/clover-${{ matrix.id }}.xml
          if-no-files-found: error
          retention-days: 30

  ci-unit-tests:
    name: ci/unit-tests
    runs-on: ubuntu-24.04
    needs: [ci-test-shards]
    if: always()
    steps:
      - name: Require every timing-balanced shard
        env:
          SHARD_RESULT: ${{ needs.ci-test-shards.result }}
        run: test "$SHARD_RESULT" = success

  prepare-random-order-plan:
    name: Prepare random-order plan
    runs-on: ubuntu-24.04
    needs: [support-contract, spec-drift]
    steps:
      # fetch-depth: 0 is not needed here: the plan is built from the
      # current checkout's test inventory and timings, not a diff against
      # the PR base (the changed-package selector that needed history was
      # removed — #2404).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Single install authority (#2404 revision): this job no longer
      # installs dependencies itself — prepare-test-plan is the one
      # authoritative install per run, and its vendor archive is what
      # ci-random-order-shard consumes (needs: prepare-test-plan below).
      # bin/build-phpunit-shards works without vendor/ present; it only
      # soft-detects the PHPUnit version for provenance when vendor exists.
      - name: Build the deterministic shard plan
        run: |
          mkdir -p build/ci
          seed=$(( (GITHUB_RUN_ID % 2147483647) + 1 ))
          echo "::notice title=PHPUnit random-order seed::$seed"
          php bin/build-phpunit-shards --shards=2 --timings=tools/phpunit-timings.json \
            --seed="$seed" > build/ci/random-order-plan.json

      - name: Retain the exact plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: random-order-plan
          path: build/ci/random-order-plan.json
          if-no-files-found: error
          retention-days: 30

  ci-random-order-shard:
    name: ci/random-order-shard-${{ matrix.id }}
    runs-on: ubuntu-24.04
    needs: [prepare-random-order-plan, prepare-test-plan]
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Download the exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: random-order-plan
          path: build/ci

      # The single install authority's run-scoped archive (prepare-test-plan)
      # — same artifact ci-test-shards consumes, so this job stops being an
      # independent codeload.github.com failure point.
      - name: Download the run-scoped dependency archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-archive
          path: build/ci

      # Exact-checkout binding: a wrong-head or tampered archive is discarded,
      # never trusted. vendor/waaseyaa/* are relative symlinks into packages/,
      # so a stale archive can carry links to packages this checkout lacks.
      # The digest/extraction/symlink checks live in
      # bin/verify-random-order-vendor-archive (extracted so they are
      # fixture-testable — see tests/Architecture/RandomOrderVendorArchiveIntegrityTest.php)
      # — check-platform-reqs stays inline here since it depends on this
      # runner's real PHP/extension profile, not on the archive itself.
      - name: Restore dependencies with integrity proof
        run: |
          set -euo pipefail
          restore_failed=0
          bin/verify-random-order-vendor-archive build/ci . || restore_failed=1
          if test "$restore_failed" -eq 0; then
            composer check-platform-reqs --no-interaction || restore_failed=1
          fi
          if test "$restore_failed" -ne 0; then
            echo "::warning title=Dependency archive rejected::falling back to a locked install"
            rm -rf vendor
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Execute the shard in replayable random order
        run: php bin/test-random-order --plan=build/ci/random-order-plan.json --shard=${{ matrix.id }}

  ci-random-order:
    name: ci/random-order
    runs-on: ubuntu-24.04
    needs: [prepare-random-order-plan, ci-random-order-shard]
    if: always()
    steps:
      # `if: always()` alone would publish success after skipped shards, so the
      # aggregator asserts planning succeeded and the shard matrix's
      # aggregate result is success (GitHub sets needs.<matrix-job>.result to
      # success only when every leg of a fail-fast:false matrix succeeded —
      # any failed, cancelled, or skipped leg makes it non-success). This also
      # covers ci-random-order-shard's own dependency on prepare-test-plan
      # (the single install authority, #2404 revision): if that job fails or
      # is cancelled, the shard matrix is skipped rather than run, so its
      # aggregate result is non-success and this gate still fails closed.
      #
      # Matrix *width* (exactly two legs) is not something this runtime
      # check can express — GitHub's aggregate result answers "did every leg
      # that ran succeed", not "how many legs ran". Width is pinned instead
      # by tests/Architecture/CiSingleExecutionProofTest.php asserting
      # `id: [1, 2]` on the ci-random-order-shard job. Keep that assertion
      # and this comment in sync if the matrix ever changes. Three shards is
      # a later decision gated on measurement (docs/specs/ci-test-selection.md).
      - name: Require complete random-order evidence
        env:
          PLAN_RESULT: ${{ needs.prepare-random-order-plan.result }}
          SHARD_RESULT: ${{ needs.ci-random-order-shard.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SHARD_RESULT" = success

  ci-package-isolation:
    name: ci/package-isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: split-package-composer-${{ hashFiles('packages/access/composer.json', 'packages/testing/composer.json', 'packages/user/composer.json') }}
          restore-keys: split-package-composer-

      - name: Prove the access package install and suite in isolation
        run: bash bin/test-isolated-package access

  ci-coverage:
    name: ci/coverage
    runs-on: ubuntu-24.04
    needs: [ci-test-shards]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: xml
          coverage: none

      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-test-shard-*
          path: build/logs/shards
          merge-multiple: true

      - name: Require successful shards and merge coverage
        env:
          SHARD_RESULT: ${{ needs.ci-test-shards.result }}
        run: |
          test "$SHARD_RESULT" = success
          php bin/merge-clover-coverage --output=build/logs/clover.xml build/logs/shards/clover-*.xml

      - name: Summarize package coverage
        run: |
          php bin/summarize-php-coverage build/logs/clover.xml > build/logs/coverage-summary.json
          cat build/logs/coverage-summary.json > build/logs/coverage.txt

      - name: Enforce PHP coverage baselines
        run: php bin/check-php-coverage-baseline build/logs/coverage-summary.json

      - name: Enforce changed PHP coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: php bin/check-changed-php-coverage --clover=build/logs/clover.xml --base="$COVERAGE_BASE_SHA" --threshold=80

      - name: Upload PHP coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: php-coverage
          path: |
            build/logs/clover.xml
            build/logs/coverage.txt
            build/logs/coverage-summary.json
          retention-days: 30

  mutation-pilot:
    name: ci/mutation-pilot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Measure the bounded mutation pilot
        run: time php bin/test-mutation-pilot

      - name: Upload mutation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-pilot
          path: |
            build/logs/mutation-summary.json
            build/logs/mutation.log
          if-no-files-found: error
          retention-days: 30

  skeleton-create-project:
    name: ci/skeleton-create-project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # This job is a separate consumer from prepare-test-plan's run-scoped
      # vendor archive: it builds a fresh skeleton project, not this repo's
      # own vendor/ tree, so it cannot reuse that artifact. Key exactly on
      # OS, PHP version, and composer.lock hash — no broad restore keys — so
      # a stale cache entry is never silently reused across dependency
      # graphs (docs/specs/ci-test-selection.md §7.3 names this the
      # persistent-cache hazard). This is Composer's package download cache
      # (~/.cache/composer/files), not a vendor/ tree cache: safe to reuse
      # across the multiple composer installs this job runs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: create-project (path skeleton) and audit-site
        env:
          # A release commit reaches main before its package graph can be
          # published. Treat that one push like the pre-tag gate so split
          # publication is not circularly blocked by Packagist availability.
          SOURCE_SKELETON: "${{ startsWith(github.ref_name, 'release-cut/') || (github.event_name == 'push' && github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'chore: release ')) }}"
        run: |
          set -euo pipefail
          # Bounded retry with backoff around network-touching Composer
          # commands: PR #2406 hit repeated HTTP/2 429s from
          # codeload.github.com in this exact job. 3 attempts, 5s/10s delay.
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          work=$(mktemp -d)
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT
          if [[ "$SOURCE_SKELETON" == "true" ]]; then
            # The exact release commit advances the skeleton before that
            # version can exist on Packagist. Prove the same consumer flow
            # against this exact checkout instead of creating a circular
            # dependency on the not-yet-published tag.
            git -C "$GITHUB_WORKSPACE" checkout -B main
            composer_retry composer create-project waaseyaa/waaseyaa "$work/skel-proj" \
              --repository='{"type":"path","url":"skeleton"}' \
              --stability=dev \
              --no-install --no-scripts \
              --no-interaction
            composer config --working-dir="$work/skel-proj" repositories.framework path "$GITHUB_WORKSPACE"
            composer config --working-dir="$work/skel-proj" repositories.packages path "$GITHUB_WORKSPACE/packages/*"
            composer require --working-dir="$work/skel-proj" waaseyaa/framework:dev-main --no-update --no-interaction
            composer_retry composer install --working-dir="$work/skel-proj" --no-interaction
            composer run-script --working-dir="$work/skel-proj" post-create-project-cmd
          else
            # Ordinary PR/main CI proves the latest committed skeleton floor is
            # resolvable from the already-published release line.
            composer_retry composer create-project waaseyaa/waaseyaa "$work/skel-proj" \
              --repository='{"type":"path","url":"skeleton"}' \
              --stability=dev \
              --no-interaction
          fi
          (cd "$work/skel-proj" && ./bin/maintenance/waaseyaa-audit-site)

      - name: Fresh skeleton preserves the complete discovery set without classmap optimization
        run: |
          set -euo pipefail
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          git -C "$GITHUB_WORKSPACE" checkout -B main
          work=$(mktemp -d)
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT
          cp -R skeleton/. "$work/"
          composer config --working-dir="$work" optimize-autoloader false
          composer config --working-dir="$work" repositories.framework path "$GITHUB_WORKSPACE"
          composer config --working-dir="$work" repositories.packages path "$GITHUB_WORKSPACE/packages/*"
          composer require --working-dir="$work" waaseyaa/framework:dev-main --no-update --no-interaction
          composer_retry composer install --working-dir="$work" --no-interaction --no-scripts --no-plugins
          test "$(php -r '$m=require $argv[1]; echo count(array_filter(array_keys($m), static fn(string $c): bool => str_starts_with($c, "Waaseyaa\\")));' "$work/vendor/composer/autoload_classmap.php")" = 0
          php "$GITHUB_WORKSPACE/tools/policy-discovery-smoke.php" "$work"

      - name: Minimal and full installs expose only installed optional domains
        run: tools/optional-domain-install-shapes.sh

  packaged-form:
    name: packaged-form
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Cache packaged-form Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/PackagedForm/skeleton/vendor
          key: packaged-form-composer-v1-${{ hashFiles('tests/PackagedForm/skeleton/composer.lock') }}
          restore-keys: packaged-form-composer-v1-

      - name: Install packaged-form dependencies
        working-directory: tests/PackagedForm/skeleton
        run: composer install --no-interaction --prefer-dist

      - name: Run packaged-form tests
        working-directory: tests/PackagedForm/skeleton
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist

  site-reference-consumer:
    name: site-reference-consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # GitHub is only a hosted adapter. This same executable is the authority
      # locally and on Forgejo, Gitea, GitLab, Jenkins, or another runner.
      - name: Prove the clean provider-neutral reference consumer
        run: tests/ReferenceConsumer/check-reference-consumer

  core-only-boot:
    # Boots the kernel from a consumer that requires ONLY waaseyaa/core, installed via a path
    # repository so it tests the SOURCE core metapackage (no release lag). Guards the class of
    # bug where core omits a fail-closed kernel boot dependency (e.g. waaseyaa/scheduler, fixed
    # in this train) — the gap that source-tree co-resolution masks. See tests/CoreOnlyBoot/boot.php.
    name: ci/core-only-boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Install waaseyaa/core alone and boot the kernel
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT
          # CI checks out a detached merge ref, so the packages/* path repos are version-guessed
          # as a bare dev-<sha> pseudo-version that matches no numeric constraint. Put HEAD on a
          # local `main` so they resolve via the existing dev-main -> 0.1.x-dev branch-alias and
          # satisfy the internal ^<tag> sibling constraints (the canonical path repo otherwise
          # blocks Packagist fallback). Tree is unchanged — same commit, so the checkout is clean.
          git -C "$GITHUB_WORKSPACE" checkout -B main
          printf '{"name":"waaseyaa/core-only-boot-fixture","type":"project","require":{"waaseyaa/core":"*"},"repositories":[{"type":"path","url":"%s/packages/*","options":{"symlink":false}}],"minimum-stability":"dev","prefer-stable":true}\n' "$GITHUB_WORKSPACE" > "$work/composer.json"
          composer install --working-dir "$work" --no-interaction
          test -d "$work/vendor/waaseyaa/scheduler" || { echo "::error::core-only install did not pull waaseyaa/scheduler (core metapackage is missing a fail-closed kernel boot dependency)"; exit 1; }
          mkdir -p "$work/config" "$work/config/sync" "$work/storage" "$work/storage/files"
          cp "$GITHUB_WORKSPACE/skeleton/config/waaseyaa.php" "$work/config/waaseyaa.php"
          # The fixture is an explicit testing profile. Production/local boots
          # require a real active configuration generation and fail closed.
          printf 'APP_ENV=testing\nAPP_DEBUG=false\n' > "$work/.env"
          cp "$GITHUB_WORKSPACE/tests/CoreOnlyBoot/boot.php" "$work/boot.php"
          cp "$GITHUB_WORKSPACE/tests/CoreOnlyBoot/prepare-runtime-schema.php" "$work/prepare-runtime-schema.php"
          php "$work/prepare-runtime-schema.php"
          WAASEYAA_DB="$work/storage/core-only.sqlite" php "$work/boot.php"

  verify-gates:
    name: ci/verify-gates
    # The permanent "verify-only" boundary gates that `composer verify` runs but CI
    # historically did NOT, so they could not gate PRs (audit C-17 — CI was a strict subset
    # of verify). Wired here after confirming each green at HEAD. Run via the `composer
    # <script>` aliases so this job stays byte-identical to what `composer verify` enforces.
    # (check-phpstan-paths — the PHPStan coverage invariant — was added for audit C-19.)
    # (check-admin-dist-fresh — the D6 admin-SPA-dist freshness gate — was added here so a stale committed admin dist fails the PR in blocking CI, not only via the out-of-band admin-dist.yml fix-up workflow.)
    #
    # check-external-consumers is intentionally NOT here: it is a mission-scoped pre-deletion
    # tripwire (WP01 ai-tools migration, key 'ai-agent-orphans'), not a permanent invariant —
    # its accessCheck(false) scan flags legitimate system-context usage framework-wide
    # (seo/path/user/groups/field) because its excludes snapshot went stale. It was
    # reclassified out of `composer verify` so verify == this CI gate set; run it on demand via
    # `composer check-external-consumers`. See roadmap triage for the retire/narrow follow-up.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run the permanent verify-only boundary gates
        run: |
          set -uo pipefail
          fail=0
          run_gate() {
            echo "::group::composer $1"
            if composer "$1"; then
              echo "PASS: $1"
            else
              echo "::error::verify gate failed: composer $1"
              fail=1
            fi
            echo "::endgroup::"
          }
          run_gate check-phpstan-paths
          run_gate check-portable-paths
          run_gate check-phpunit-paths
          run_gate check-s1-configuration-authority
          run_gate check-package-layers-pl008-self-test
          run_gate check-distribution-extensions
          run_gate check-symfony-imports
          run_gate check-getquery-bindings
          run_gate check-dispatcher-keys
          run_gate check-admin-coercion-patterns
          run_gate check-admin-coercion-self-test
          run_gate check-admin-dist-fresh
          run_gate check-field-guards
          run_gate check-access-hardening
          run_gate check-openapi
          exit "$fail"

  ci-playwright-smoke:
    name: ci/playwright-smoke
    runs-on: ubuntu-24.04
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/admin/node_modules
          key: node-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Install dependencies and Playwright
        run: cd packages/admin && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium firefox

      - name: Start PHP backend
        run: |
          php -S 127.0.0.1:8080 -t public/ > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run Playwright smoke tests
        run: cd packages/admin && npx playwright test --project=chromium --project=firefox

      - name: Summarize Playwright retries
        if: always()
        run: cd packages/admin && npm run test:e2e:summary

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-smoke-results
          path: |
            packages/admin/test-results/
            packages/admin/playwright-report/
          retention-days: 30

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-logs
          path: |
            /tmp/php-server.log
            /tmp/nuxt-server.log
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/admin/node_modules
          key: node-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Admin SPA
        run: npm run build

      - name: Measure frontend unit-test coverage
        run: npm run test:coverage

      - name: Enforce changed admin coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/check-changed-coverage.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-build
          path: packages/admin/.output/
          retention-days: 14

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: packages/admin/coverage/
          retention-days: 30

  manifest-conformance:
    name: Manifest conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Validate defaults manifests have project_versioning
        run: |
          fail=0
          for f in defaults/*.yaml; do
            if ! grep -q 'project_versioning' "$f"; then
              echo "FAIL: $f is missing project_versioning block"
              fail=1
            fi
          done
          exit $fail

      - name: Validate defaults JSON Schemas are well-formed
        run: |
          fail=0
          for f in defaults/*.schema.json; do
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "FAIL: $f is not valid JSON"
              fail=1
            fi
          done
          exit $fail

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install ajv-cli
        run: npm install -g ajv-cli

      - name: Validate defaults JSON Schemas are valid draft-07
        run: |
          fail=0
          for f in defaults/*.schema.json; do
            if ! ajv compile --spec=draft7 --strict=false -s "$f" > /dev/null 2>&1; then
              echo "FAIL: $f is not a valid JSON Schema draft-07"
              fail=1
            fi
          done
          exit $fail

  ingestion-defaults:
    name: Ingestion defaults
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Validate ingestion schema metadata and compatibility rules
        run: bash bin/check-ingestion-defaults

  release-publish-shape:
    name: Release publish shape
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Assert exactly-once Packagist publish + forward-only release shape
        run: bash bin/check-release-publish-shape

  security-defaults:
    name: Security defaults
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Check no secrets in defaults/
        run: bash bin/check-no-secrets

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run structural secrets scan
        run: ./vendor/bin/phpunit --filter Phase22 --no-coverage
