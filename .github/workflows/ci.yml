name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  # Dispatched by release-cut.yml on its gate branch so the exact release
  # commit is CI-proven BEFORE the tag is created (red-at-tag fix, alpha.202
  # post-mortem). Manual dispatch on any ref is also fine. auto-merge.yml
  # chain-dispatches this workflow on the merge commit SHA after a bot-token
  # merge (which suppresses the push trigger) — see auto-merge.yml (#1937).
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA to check out (empty = tip of the dispatched ref)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  immutable-source-artifact:
    name: Immutable exact-head source artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Build and verify the exact source artifact
        env:
          EXACT_SHA: ${{ inputs.sha || github.sha }}
        run: |
          bin/build-exact-source-artifact build/exact-source "$EXACT_SHA"
          bin/verify-exact-source-artifact build/exact-source "$EXACT_SHA"

      - name: Upload the immutable source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framework-source-${{ inputs.sha || github.sha }}
          path: build/exact-source/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  support-contract:
    name: support/s1-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify bounded S1 support contract
        run: php bin/check-support-contract --ci --evidence=support-contract-evidence.json

      # GitHub is a replaceable executor. This command and its repository
      # evidence are the portable topology gate.
      - name: Verify S1 SQLite topology contract
        run: php bin/check-s1-sqlite-contract --ci

      - name: Verify S1 configuration activation contract
        run: php bin/check-s1-configuration-activation

      - name: Verify S1 configuration authority contract
        run: php bin/check-s1-configuration-authority

      - name: Verify S1 schema authority contract
        run: php bin/check-s1-schema-authority

      - name: Publish exact environment evidence
        if: always()
        run: |
          if test -f support-contract-evidence.json; then
            cat support-contract-evidence.json
          else
            echo "support-contract evidence was not produced"
          fi

      - name: Upload exact environment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: support-contract-evidence-${{ inputs.sha || github.sha }}
          path: support-contract-evidence.json
          if-no-files-found: warn
          retention-days: 30

  release-pipeline-fixtures:
    name: Release pipeline fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      # Guards the decision logic that was wrong at alpha.285: an accepted POST
      # is not publication, and an existing package is not a published version.
      # No network, no credentials — canned P2 fixtures only.
      - name: Packagist verification fixtures
        run: bash tests/release/packagist-verification.bats.sh

  release-evidence:
    name: Deterministic release evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Generate and replay release evidence from synthetic split inputs
        env:
          RELEASE_EVIDENCE_DRY_RUN_OUTPUT: build/release-evidence
        run: node tests/Architecture/release-evidence-regression.mjs

      - name: Retain pull-request dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-dry-run-${{ github.sha }}
          path: build/release-evidence
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  composer-policy:
    name: composer-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-tags: true  # fetch-tags: required for CP-NEW (composer-internal-version-sweep WP03)

      - name: Enforce composer policy
        run: php bin/check-composer-policy

      - name: Enforce portable repository paths
        run: php bin/check-portable-paths

      - name: Enforce repository-root hygiene (#2927)
        run: php bin/check-repo-root-hygiene

      - name: Enforce package layer graph
        run: php bin/check-package-layers

      - name: Audit require-dev layer graph (warn-only)
        run: bash bin/audit-require-dev-layers

  composer-deps-audit:
    name: composer-deps-audit (warn-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      # Exact key only (runner OS + PHP version + composer.lock hash) — no
      # restore-keys: a broad prefix can hand this job a vendor/ tree built
      # from a different lock file (docs/specs/ci-test-selection.md §7.3
      # names the hazard). A miss here just means a fresh install, which the
      # composite action below retries with backoff.
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Run composer-dependency audit (warn-only)
        run: bash bin/audit-composer-deps

  spec-drift:
    name: spec-drift
    # Doc-code coupling is a pull-request concern (like changelog-discipline):
    # it asks "did this PR update the spec alongside the source?". There is no
    # such question to ask on a post-merge push to main, so skip it there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check for stale specs
        if: github.event_name == 'pull_request'
        run: bash tools/drift-detector.sh "origin/${{ github.base_ref }}"

      - name: Skip PR-only coupling check
        if: github.event_name != 'pull_request'
        run: echo "spec-drift is a pull-request coupling check; no PR diff exists for this event."

  ci-lint:
    name: ci/lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      # Exact key only — see composer-deps-audit's identical block above for
      # the rationale (no broad restore-keys; retry absorbs a cache miss).
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Validate composer.json
        run: composer validate

      - name: Framework provenance (lockfile vs checkout SHA)
        env:
          WAASEYAA_GOLDEN_SHA: ${{ github.sha }}
        run: php -r "require 'vendor/autoload.php'; exit(Waaseyaa\\CLI\\Provenance\\ComposerProvenanceReporter::main(getcwd(), []));"

      - name: Check PHP syntax
        run: find packages/*/src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run CS Fixer (dry-run)
        run: composer cs-check

      - name: Restore PHPStan result cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/phpstan
          key: phpstan-result-cache-${{ github.run_id }}
          restore-keys: |
            phpstan-result-cache-

      - name: Run PHPStan
        run: composer phpstan

      - name: Save PHPStan result cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: tmp/phpstan
          key: phpstan-result-cache-${{ github.run_id }}

  check-dead-code:
    name: check-dead-code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none

      # Exact key only — see composer-deps-audit's identical block for the
      # rationale (no broad restore-keys; retry absorbs a cache miss).
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Restore dead-code PHPStan result cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/phpstan-dead-code
          # Exact key only: dead-code reachability is global, so an analyzed
          # PHP/PHPDoc change can invalidate results without changing analyzer
          # configuration. The analyzer hash busts rule/config changes; run_id
          # is the custody boundary that prevents reuse across workflow runs.
          key: phpstan-dead-code-cache-${{ hashFiles('tools/phpstan/WaaseyaaEntrypointProvider.php', 'phpstan-dead-code.neon', 'phpstan-dead-code-baseline.neon', 'phpstan.neon') }}-${{ github.run_id }}

      - name: Run dead-code check (fails on new findings)
        run: php bin/check-dead-code

      - name: Save dead-code PHPStan result cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: tmp/phpstan-dead-code
          key: phpstan-dead-code-cache-${{ hashFiles('tools/phpstan/WaaseyaaEntrypointProvider.php', 'phpstan-dead-code.neon', 'phpstan-dead-code-baseline.neon', 'phpstan.neon') }}-${{ github.run_id }}

  prepare-test-plan:
    name: Prepare timing-balanced PHPUnit plan
    runs-on: ubuntu-24.04
    needs: [support-contract, spec-drift]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Exact key only, everywhere in this file (round 3 harmonization): a
      # download-cache prefix hit cannot hand a job a wrong dependency tree
      # (it's keyed by package name+version, not a resolved vendor/ tree),
      # but this file settled on one consistent no-restore-keys rule for
      # every Composer cache tier rather than reasoning about two policies.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      # Single install authority (#2404 revision): every downstream test job
      # (ci-test-shards, ci-random-order-shard) consumes this exact-head
      # install as a run-scoped artifact instead of each running its own
      # `composer install` against codeload.github.com. Three CI reruns on
      # PR #2406 failed on repeated HTTP/2 429s from three independent
      # installs (this job, ci/test-shard-1, ci/skeleton-create-project) —
      # collapsing the first two into one authority removes two of the
      # three failure points outright. This install is now the single
      # highest-consequence one in the run (round 2 review, item 1): both
      # shard matrices transitively depend on it, so it is retry-wrapped
      # like every other install in this file, not left bare.
      - name: Install dependencies (single authority for this run)
        uses: ./.github/actions/composer-install-retry
        with:
          args: '--no-interaction --prefer-dist --no-progress'

      - name: Prepare the run-scoped dependency archive
        run: |
          mkdir -p build/ci
          tar --create --file build/ci/vendor.tar vendor
          sha256sum build/ci/vendor.tar > build/ci/vendor.tar.sha256
          php -r '$h = hash_file("sha256", "vendor/composer/installed.php"); file_put_contents("build/ci/installed.sha256", $h . PHP_EOL);'

      - name: Build deterministic shard plan
        run: |
          mkdir -p build/ci
          php bin/build-phpunit-shards --shards=4 --timings=tools/phpunit-timings.json > build/ci/phpunit-shards.json
          php -r '$p = json_decode(file_get_contents("build/ci/phpunit-shards.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($p["include"] as $s) { printf("shard %d: %d files, %.2fs recorded, %d fallback%s", $s["id"], $s["test_files"], $s["expected_seconds"], $s["fallback_files"], PHP_EOL); }'

      - name: Retain exact shard plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-shard-plan
          path: build/ci/phpunit-shards.json
          retention-days: 30

      # Consumed by both ci-test-shards and ci-random-order-shard via
      # bin/verify-random-order-vendor-archive, with a locked `composer
      # install` fallback on verification failure in each consumer.
      - name: Retain the run-scoped dependency archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-archive
          path: |
            build/ci/vendor.tar
            build/ci/vendor.tar.sha256
            build/ci/installed.sha256
          if-no-files-found: error
          retention-days: 30

  ci-test-shards:
    name: ci/test-shard-${{ matrix.id }}
    runs-on: ubuntu-24.04
    needs: [support-contract, spec-drift, prepare-test-plan]
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: pcov

      # Exact key only — see prepare-test-plan's identical block for the
      # file-wide rationale.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Download the run-scoped dependency archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-archive
          path: build/ci

      # Same fail-closed integrity gate ci-random-order-shard uses: a
      # wrong-head or tampered archive is discarded, never trusted, and the
      # job falls back to a locked `composer install` rather than force
      # artifact use. See bin/verify-random-order-vendor-archive for the
      # digest/extraction/symlink checks (fixture-tested in
      # tests/Architecture/RandomOrderVendorArchiveIntegrityTest.php). The
      # fallback install itself is retry-wrapped (round 2 review, item 2):
      # this path triggers precisely when something is already wrong, and
      # network flakiness is a plausible cause, so the two failure modes
      # can compound without it.
      - name: Restore dependencies with integrity proof
        run: |
          set -euo pipefail
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          restore_failed=0
          bin/verify-random-order-vendor-archive build/ci . || restore_failed=1
          if test "$restore_failed" -eq 0; then
            composer check-platform-reqs --no-interaction || restore_failed=1
          fi
          if test "$restore_failed" -ne 0; then
            echo "::error title=Dependency archive rejected::falling back to a locked install for ci/test-shard-${{ matrix.id }}"
            echo "### :warning: Dependency archive rejected — ci/test-shard-${{ matrix.id }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Fell back to a locked \`composer install\`. If this happens broadly, the 429 mitigation (run-scoped vendor archive) has stopped applying — see #2404." >> "$GITHUB_STEP_SUMMARY"
            rm -rf vendor
            composer_retry composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Download exact shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phpunit-shard-plan
          path: build/ci

      # tests/Architecture/SplitTargetReachabilityGateTest EXECUTES
      # bin/check-release-require-parity, which parses the split matrix as YAML
      # and fails closed (RR005) without a parser. Declared here for the same
      # reason it is declared in release-cut.yml and split.yml: the gate must
      # never be exercised against an environment that silently lacks it.
      - name: Provision the YAML parser the split-matrix gate requires
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          }
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Execute shard once with test and coverage evidence
        env:
          SHARD_ID: ${{ matrix.id }}
        run: |
          mkdir -p build/logs
          php -r '$p = json_decode(file_get_contents("build/ci/phpunit-shards.json"), true, 512, JSON_THROW_ON_ERROR); $id = (int) getenv("SHARD_ID"); foreach ($p["include"] as $s) { if ($s["id"] === $id) { file_put_contents("build/ci/test-paths", $s["paths"] . PHP_EOL); exit(0); } } fwrite(STDERR, "Shard id is absent from the exact plan." . PHP_EOL); exit(2);'
          mapfile -t test_paths < build/ci/test-paths
          test "${#test_paths[@]}" -gt 0
          vendor/bin/phpunit "${test_paths[@]}" \
            --coverage-clover build/logs/clover-${{ matrix.id }}.xml \
            --log-junit build/logs/junit-${{ matrix.id }}.xml

      - name: Verify the shard left the repository root clean (#2927)
        run: php bin/check-repo-root-hygiene

      - name: Upload shard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: php-test-shard-${{ matrix.id }}
          path: |
            build/logs/junit-${{ matrix.id }}.xml
            build/logs/clover-${{ matrix.id }}.xml
          if-no-files-found: error
          retention-days: 30

  ci-unit-tests:
    name: ci/unit-tests
    runs-on: ubuntu-24.04
    needs: [ci-test-shards]
    if: always()
    steps:
      - name: Require every timing-balanced shard
        env:
          SHARD_RESULT: ${{ needs.ci-test-shards.result }}
        run: test "$SHARD_RESULT" = success

  prepare-random-order-plan:
    name: Prepare random-order plan
    runs-on: ubuntu-24.04
    needs: [support-contract, spec-drift]
    steps:
      # fetch-depth: 0 is not needed here: the plan is built from the
      # current checkout's test inventory and timings, not a diff against
      # the PR base (the changed-package selector that needed history was
      # removed — #2404).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Single install authority (#2404 revision): this job no longer
      # installs dependencies itself — prepare-test-plan is the one
      # authoritative install per run, and its vendor archive is what
      # ci-random-order-shard consumes (needs: prepare-test-plan below).
      # bin/build-phpunit-shards works without vendor/ present; it only
      # soft-detects the PHPUnit version for provenance when vendor exists.
      - name: Build the deterministic shard plan
        run: |
          mkdir -p build/ci
          seed=$(( (GITHUB_RUN_ID % 2147483647) + 1 ))
          echo "::notice title=PHPUnit random-order seed::$seed"
          php bin/build-phpunit-shards --shards=2 --timings=tools/phpunit-timings.json \
            --seed="$seed" > build/ci/random-order-plan.json

      - name: Retain the exact plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: random-order-plan
          path: build/ci/random-order-plan.json
          if-no-files-found: error
          retention-days: 30

  ci-random-order-shard:
    name: ci/random-order-shard-${{ matrix.id }}
    runs-on: ubuntu-24.04
    needs: [prepare-random-order-plan, prepare-test-plan]
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Download the exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: random-order-plan
          path: build/ci

      # The single install authority's run-scoped archive (prepare-test-plan)
      # — same artifact ci-test-shards consumes, so this job stops being an
      # independent codeload.github.com failure point.
      - name: Download the run-scoped dependency archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-archive
          path: build/ci

      # Exact-checkout binding: a wrong-head or tampered archive is discarded,
      # never trusted. vendor/waaseyaa/* are relative symlinks into packages/,
      # so a stale archive can carry links to packages this checkout lacks.
      # The digest/extraction/symlink checks live in
      # bin/verify-random-order-vendor-archive (extracted so they are
      # fixture-testable — see tests/Architecture/RandomOrderVendorArchiveIntegrityTest.php)
      # — check-platform-reqs stays inline here since it depends on this
      # runner's real PHP/extension profile, not on the archive itself. The
      # fallback install itself is retry-wrapped (round 2 review, item 2) —
      # same rationale as ci-test-shards's identical block.
      - name: Restore dependencies with integrity proof
        run: |
          set -euo pipefail
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          restore_failed=0
          bin/verify-random-order-vendor-archive build/ci . || restore_failed=1
          if test "$restore_failed" -eq 0; then
            composer check-platform-reqs --no-interaction || restore_failed=1
          fi
          if test "$restore_failed" -ne 0; then
            echo "::error title=Dependency archive rejected::falling back to a locked install for ci/random-order-shard-${{ matrix.id }}"
            echo "### :warning: Dependency archive rejected — ci/random-order-shard-${{ matrix.id }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Fell back to a locked \`composer install\`. If this happens broadly, the 429 mitigation (run-scoped vendor archive) has stopped applying — see #2404." >> "$GITHUB_STEP_SUMMARY"
            rm -rf vendor
            composer_retry composer install --no-interaction --prefer-dist --no-progress
          fi

      # tests/Architecture/SplitTargetReachabilityGateTest EXECUTES
      # bin/check-release-require-parity, which parses the split matrix as YAML
      # and fails closed (RR005) without a parser. Declared here for the same
      # reason it is declared in release-cut.yml and split.yml: the gate must
      # never be exercised against an environment that silently lacks it.
      - name: Provision the YAML parser the split-matrix gate requires
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          }
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Execute the shard in replayable random order
        run: php bin/test-random-order --plan=build/ci/random-order-plan.json --shard=${{ matrix.id }}

      - name: Verify the random-order shard left the repository root clean (#2927)
        run: php bin/check-repo-root-hygiene

  ci-random-order:
    name: ci/random-order
    runs-on: ubuntu-24.04
    needs: [prepare-random-order-plan, ci-random-order-shard]
    if: always()
    steps:
      # `if: always()` alone would publish success after skipped shards, so the
      # aggregator asserts planning succeeded and the shard matrix's
      # aggregate result is success (GitHub sets needs.<matrix-job>.result to
      # success only when every leg of a fail-fast:false matrix succeeded —
      # any failed, cancelled, or skipped leg makes it non-success). This also
      # covers ci-random-order-shard's own dependency on prepare-test-plan
      # (the single install authority, #2404 revision): if that job fails or
      # is cancelled, the shard matrix is skipped rather than run, so its
      # aggregate result is non-success and this gate still fails closed.
      #
      # Matrix *width* (exactly two legs) is not something this runtime
      # check can express — GitHub's aggregate result answers "did every leg
      # that ran succeed", not "how many legs ran". Width is pinned instead
      # by tests/Architecture/CiSingleExecutionProofTest.php asserting
      # `id: [1, 2]` on the ci-random-order-shard job. Keep that assertion
      # and this comment in sync if the matrix ever changes. Three shards is
      # a later decision gated on measurement (docs/specs/ci-test-selection.md).
      - name: Require complete random-order evidence
        env:
          PLAN_RESULT: ${{ needs.prepare-random-order-plan.result }}
          SHARD_RESULT: ${{ needs.ci-random-order-shard.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SHARD_RESULT" = success

  ci-package-isolation:
    name: ci/package-isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Exact key only — no restore-keys, same rationale as the root-graph
      # jobs. bin/test-isolated-package runs its own `composer install`
      # (COMPOSER_ROOT_VERSION=dev-main, an isolated single-package
      # resolution) — the retry wrapping below absorbs a cache miss.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-split-package-composer-${{ hashFiles('packages/access/composer.json', 'packages/testing/composer.json', 'packages/user/composer.json') }}

      # Two-phase split (#2404 revision, round 3, item 3): retry covers only
      # the network-touching install phase (--install-only=<file>), never
      # the test run. Retrying a whole test run would give a deterministic
      # failure three attempts and let a flaky or order-dependent test mask
      # real signal — a materially different risk than retrying a network
      # call. --run-tests=<dir> then runs the isolated suite exactly once,
      # unretried, and owns cleanup of the directory --install-only handed
      # off (see bin/test-isolated-package's HANDED_OFF ownership comment).
      #
      # The isolation path is handed off through a dedicated file, NOT this
      # step's stdout (round 4 fix): Composer's own stdout — progress
      # noise, a PHP 8.5 deprecation notice from its bundled react/promise
      # on every invocation — is never redirected inside the script, so
      # capturing the script's whole stdout via command substitution
      # silently prepended that chatter ahead of the path, producing a
      # multi-line value that broke GITHUB_ENV's parser. A file the script
      # writes to only at its own successful hand-off point cannot be
      # polluted by anything a subprocess prints.
      - name: Install the isolated access package (retry with backoff)
        run: |
          set -euo pipefail
          isolation_file="$(mktemp)"
          attempt=1
          max_attempts=3
          delay=5
          until bash bin/test-isolated-package access --install-only="$isolation_file"; do
            exit_code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              exit "$exit_code"
            fi
            echo "::warning title=test-isolated-package install failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo "ISOLATION_DIR=$(cat "$isolation_file")" >> "$GITHUB_ENV"
          rm -f "$isolation_file"

      - name: Run the isolated access package suite (unretried)
        run: bash bin/test-isolated-package access --run-tests="$ISOLATION_DIR"

  ci-coverage:
    name: ci/coverage
    runs-on: ubuntu-24.04
    needs: [ci-test-shards]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: xml
          coverage: none

      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-test-shard-*
          path: build/logs/shards
          merge-multiple: true

      - name: Require successful shards and merge coverage
        env:
          SHARD_RESULT: ${{ needs.ci-test-shards.result }}
        run: |
          test "$SHARD_RESULT" = success
          php bin/merge-clover-coverage --output=build/logs/clover.xml build/logs/shards/clover-*.xml

      - name: Summarize package coverage
        run: |
          php bin/summarize-php-coverage build/logs/clover.xml > build/logs/coverage-summary.json
          cat build/logs/coverage-summary.json > build/logs/coverage.txt

      - name: Enforce PHP coverage baselines
        run: php bin/check-php-coverage-baseline build/logs/coverage-summary.json

      - name: Enforce changed PHP coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: php bin/check-changed-php-coverage --clover=build/logs/clover.xml --base="$COVERAGE_BASE_SHA" --threshold=80

      - name: Upload PHP coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: php-coverage
          path: |
            build/logs/clover.xml
            build/logs/coverage.txt
            build/logs/coverage-summary.json
          retention-days: 30

  mutation-pilot:
    name: ci/mutation-pilot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: pcov

      # Exact key only — see composer-deps-audit's identical block for the
      # rationale (no broad restore-keys; retry absorbs a cache miss).
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Measure the bounded mutation pilot
        run: time php bin/test-mutation-pilot

      - name: Upload mutation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-pilot
          path: |
            build/logs/mutation-summary.json
            build/logs/mutation.log
          if-no-files-found: error
          retention-days: 30

  skeleton-create-project:
    name: ci/skeleton-create-project
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 2 is required by the fail-closed release-cut guard in the
      # production-image step below: it compares skeleton/Dockerfile at HEAD
      # against the same path at HEAD's first parent, and depth 1 has no
      # parent to compare against. Two commits is the whole requirement — the
      # guard needs one prior revision, not history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # This job is a separate consumer from prepare-test-plan's run-scoped
      # vendor archive: it builds a fresh skeleton project, not this repo's
      # own vendor/ tree, so it cannot reuse that artifact. Key exactly on
      # OS, PHP version, and composer.lock hash — no broad restore keys — so
      # a stale cache entry is never silently reused across dependency
      # graphs (docs/specs/ci-test-selection.md §7.3 names this the
      # persistent-cache hazard). This is Composer's package download cache
      # (~/.cache/composer/files), not a vendor/ tree cache: safe to reuse
      # across the multiple composer installs this job runs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: create-project (path skeleton) and audit-site
        env:
          # A release commit reaches main before its package graph can be
          # published. Treat that one push like the pre-tag gate so split
          # publication is not circularly blocked by Packagist availability.
          SOURCE_SKELETON: "${{ startsWith(github.ref_name, 'release-cut/') || (github.event_name == 'push' && github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'chore: release ')) }}"
        run: |
          set -euo pipefail
          # Bounded retry with backoff around network-touching Composer
          # commands: PR #2406 hit repeated HTTP/2 429s from
          # codeload.github.com in this exact job. 3 attempts, 5s/10s delay.
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          # #2673: the created project is RETAINED for the production-image
          # step below, which must build from a real create-project consumer
          # rather than a hand-assembled context. RUNNER_TEMP is per-job and
          # the runner discards it when the job ends, so nothing outlives the
          # job that a mktemp -d + trap would have removed.
          work="$RUNNER_TEMP/skeleton-consumer"
          rm -rf "$work"
          mkdir -p "$work"
          if [[ "$SOURCE_SKELETON" == "true" ]]; then
            # The exact release commit advances the skeleton before that
            # version can exist on Packagist. Prove the same consumer flow
            # against this exact checkout instead of creating a circular
            # dependency on the not-yet-published tag.
            git -C "$GITHUB_WORKSPACE" checkout -B main
            composer_retry composer create-project waaseyaa/waaseyaa "$work/skel-proj" \
              --repository='{"type":"path","url":"skeleton"}' \
              --stability=dev \
              --no-install --no-scripts \
              --no-interaction
            composer config --working-dir="$work/skel-proj" repositories.framework path "$GITHUB_WORKSPACE"
            composer config --working-dir="$work/skel-proj" repositories.packages path "$GITHUB_WORKSPACE/packages/*"
            composer require --working-dir="$work/skel-proj" waaseyaa/framework:dev-main --no-update --no-interaction
            composer_retry composer install --working-dir="$work/skel-proj" --no-interaction
            composer run-script --working-dir="$work/skel-proj" post-create-project-cmd
          else
            # Ordinary PR/main CI proves the latest committed skeleton floor is
            # resolvable from the already-published release line.
            #
            # One narrow exception, and it is DATA rather than a special case
            # written into this script: a first-party package the skeleton
            # references that has never been split cannot exist on Packagist,
            # and cannot until one release cut later. Those names are listed in
            # support/skeleton-unpublished-packages.json and each gets a path
            # repository scoped with `only` to exactly that name, so every
            # other name still resolves from the published line and this job
            # keeps proving what it claims. The steady state is an empty list;
            # the step below fails once a listed package is published, which is
            # what forces the entry back out.
            #
            # bin/skeleton-unpublished-repositories renders each entry into a
            # complete repository object rather than a bare url, because a path
            # repository has no version of its own and Composer guesses one from
            # the checkout. On a PR run actions/checkout lands on a DETACHED
            # merge commit with no branch ref, so the guess is dev-<sha>, which
            # carries no branch-alias and cannot satisfy the skeleton's governed
            # ^<VERSION> floor — #2717 failed every attempt that way. The script
            # pins each rostered package to the tracked VERSION the checkout
            # already claims to be, keeps `only`, and refuses a roster, VERSION,
            # or skeleton floor it cannot verify. Assigning its output (rather
            # than piping it into mapfile) is deliberate: under `set -e` a
            # failure here stops the job instead of quietly yielding no entries.
            unpublished="$(php "$GITHUB_WORKSPACE/bin/skeleton-unpublished-repositories" "$GITHUB_WORKSPACE")"

            composer_retry composer create-project waaseyaa/waaseyaa "$work/skel-proj" \
              --repository='{"type":"path","url":"skeleton"}' \
              --stability=dev \
              --no-install --no-scripts \
              --no-interaction

            # The steady state of this roster is EMPTY, so the single blank
            # line is the path this loop is most likely to take. Input arrives
            # on fd 3 so the loop never eats the stdin `composer config` reads.
            while IFS=$'\t' read -r slug pkg rel pinned config <&3; do
              [ -n "$slug" ] || continue
              echo "::notice title=Unpublished first-party package::${pkg} resolves from ${rel} pinned to ${pinned} until it is published (support/skeleton-unpublished-packages.json)"
              composer config --working-dir="$work/skel-proj" "repositories.${slug}" "$config"
            done 3<<< "$unpublished"

            composer_retry composer install --working-dir="$work/skel-proj" --no-interaction
            composer run-script --working-dir="$work/skel-proj" post-create-project-cmd
          fi
          (cd "$work/skel-proj" && ./bin/maintenance/waaseyaa-audit-site)
          {
            echo "SKEL_PROJECT=$work/skel-proj"
            echo "SKEL_PROJECT_USES_PATH_REPOSITORIES=$SOURCE_SKELETON"
          } >> "$GITHUB_ENV"

      # An exception nobody is forced to remove becomes permanent. Every name
      # in support/skeleton-unpublished-packages.json claims to be unpublished;
      # this asks Packagist whether that is still true and fails the moment it
      # is not, so the narrowing above cannot outlive the reason for it. The
      # steady state is an empty roster, which makes this a no-op.
      - name: The unpublished-package exception is still necessary
        run: |
          set -euo pipefail
          published=()
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://repo.packagist.org/p2/${pkg}.json")"
            echo "packagist ${pkg} -> HTTP ${code}"
            if [ "$code" = "200" ]; then
              published+=("$pkg")
            elif [ "$code" != "404" ]; then
              echo "::warning title=Packagist unreachable::${pkg} returned HTTP ${code}; not treating that as published."
            fi
          done < <(
            php -r '
              $roster = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
              foreach ($roster["packages"] as $entry) {
                  echo $entry["package"], PHP_EOL;
              }
            ' support/skeleton-unpublished-packages.json
          )
          if [ "${#published[@]}" -gt 0 ]; then
            echo "::error title=Stale unpublished-package roster::${published[*]} is on Packagist now. Remove the entry from support/skeleton-unpublished-packages.json so ci/skeleton-create-project resolves the whole skeleton from the published release line again."
            exit 1
          fi

      - name: Fresh skeleton preserves the complete discovery set without classmap optimization
        run: |
          set -euo pipefail
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          git -C "$GITHUB_WORKSPACE" checkout -B main
          work=$(mktemp -d)
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT
          cp -R skeleton/. "$work/"
          composer config --working-dir="$work" optimize-autoloader false
          composer config --working-dir="$work" repositories.framework path "$GITHUB_WORKSPACE"
          composer config --working-dir="$work" repositories.packages path "$GITHUB_WORKSPACE/packages/*"
          composer require --working-dir="$work" waaseyaa/framework:dev-main --no-update --no-interaction
          composer_retry composer install --working-dir="$work" --no-interaction --no-scripts --no-plugins
          test "$(php -r '$m=require $argv[1]; echo count(array_filter(array_keys($m), static fn(string $c): bool => str_starts_with($c, "Waaseyaa\\")));' "$work/vendor/composer/autoload_classmap.php")" = 0
          php "$GITHUB_WORKSPACE/tools/policy-discovery-smoke.php" "$work"

      - name: Minimal and full installs expose only installed optional domains
        run: tools/optional-domain-install-shapes.sh

      # #2673. Nothing had ever built skeleton/Dockerfile, and it did not
      # build: `docker-php-ext-install intl` needs $PHPIZE_DEPS and the ICU
      # headers (icu-libs ships only the shared objects), `zip` is a runtime
      # requirement of waaseyaa/structured-import, and `opcache` cannot be
      # installed at all on a base image that already links it statically.
      #
      # This is the lane for it: the runner has a Docker daemon and the step
      # above has already produced a real create-project consumer, which is
      # what the acceptance requires as the build context. The **production**
      # stage is built -- not base, not deps -- and everything asserted below
      # is read out of the resulting image, never out of the Dockerfile text.
      #
      # The saved-layer scan is not redundant with `docker run`: moving the
      # `apk del` into a later RUN leaves every build-only byte committed in
      # the earlier layer while the final rootfs looks perfectly clean, and
      # only a layer-level read can see that. It is done at PACKAGE level
      # rather than by matching paths, so it covers the whole transitive
      # closure of $PHPIZE_DEPS by name without enumerating it; a widened path
      # denylist runs alongside as corroboration.
      - name: Production Docker image builds and ships its runtime extensions
        run: |
          set -euo pipefail
          if [[ "${SKEL_PROJECT_USES_PATH_REPOSITORIES:-false}" == "true" ]]; then
            # Release-cut consumers resolve waaseyaa/* from host path
            # repositories under GITHUB_WORKSPACE, which do not exist inside the
            # build container, so the deps stage cannot install and this image
            # genuinely cannot be built on that ref.
            #
            # That makes this a skip, so it is ENFORCED rather than assumed. The
            # skip is sound only while skeleton/Dockerfile is byte-identical to
            # a revision on which this step already built it; if the Dockerfile
            # changed here, the change would ship unproven, which is the exact
            # shape of gap that let this file stay broken. So: identical ->
            # skip, different -> fail, unverifiable -> fail.
            #
            # The comparison revision is HEAD's FIRST PARENT. Both shapes that
            # set SOURCE_SKELETON put the release commit at HEAD -- a
            # release-cut/* branch head, and the `chore: release ...` push to
            # main -- and in both the first parent is the main commit the cut
            # was taken from, which is a revision an ordinary run of this step
            # already built. It is also the only prior revision this job's
            # checkout is guaranteed to hold (fetch-depth: 2 above), which is
            # why it is used in preference to the release-cut source ref or a
            # PR base: neither is fetched here, so neither could be compared
            # without turning a fetch failure into a silent skip.
            #
            # Identity is the blob object id, so whitespace and line-ending
            # changes count as differences.
            parent=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet 'HEAD^' || true)
            if [[ -z "$parent" ]]; then
              echo '::error title=Release-cut skip cannot be verified::HEAD has no reachable first parent in this checkout; the guard needs fetch-depth >= 2'
              exit 1
            fi
            before=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "${parent}:skeleton/Dockerfile" || true)
            after=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet 'HEAD:skeleton/Dockerfile' || true)
            if [[ -z "$before" || -z "$after" ]]; then
              echo "::error title=Release-cut skip cannot be verified::skeleton/Dockerfile is absent at ${parent} or at HEAD"
              exit 1
            fi
            if [[ "$before" != "$after" ]]; then
              echo "::error title=skeleton/Dockerfile changed in a release commit::${before} at ${parent} became ${after} at HEAD. The production image cannot be built on a release-cut ref, so this change would ship unproven. Land Dockerfile changes through an ordinary pull request, where this step builds them."
              exit 1
            fi
            echo "::notice title=Production image build skipped::skeleton/Dockerfile is byte-identical (${after}) to ${parent}, where this step built it; the release-cut consumer resolves waaseyaa/* from host path repositories absent inside the build container"
            exit 0
          fi
          test -d "$SKEL_PROJECT"
          test -f "$SKEL_PROJECT/.env"

          docker build --target production -t waaseyaa-skeleton:ci "$SKEL_PROJECT"

          modules=$(docker run --rm waaseyaa-skeleton:ci php -m)
          echo "$modules"
          for required in intl zip pdo_sqlite 'Zend OPcache'; do
            if ! grep -qxF "$required" <<< "$modules"; then
              echo "::error title=Extension missing from the production image::$required does not load"
              exit 1
            fi
          done
          docker run --rm waaseyaa-skeleton:ci php -r 'exit(class_exists("Collator") && (new Collator("en_US"))->compare("a", "b") === -1 ? 0 : 1);'

          # The shipped artefact, not the FROM scratch context probe the #2647
          # gate uses: the generated .env must be absent from the real image
          # while its placeholder template survives.
          docker run --rm waaseyaa-skeleton:ci sh -c 'test ! -e /app/.env && test -e /app/.env.example'

          layers=$(mktemp -d)
          cleanup() { rm -rf "$layers"; docker image rm -f waaseyaa-skeleton:ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker save waaseyaa-skeleton:ci -o "$layers/image.tar"
          tar -xf "$layers/image.tar" -C "$layers"

          # (i) Package-level, and complete: every saved layer carries the apk
          # database as it stood when that layer was committed. A package named
          # in some layer but absent from the final image was installed and
          # later removed -- its files are still shipped in the layer that added
          # them. This needs no list of package names, so it covers the whole
          # transitive closure of $PHPIZE_DEPS (binutils, musl-dev,
          # libstdc++-dev, mpfr4, ...) and the `.build-deps` virtual package
          # itself, none of which a path denylist would enumerate.
          docker run --rm --entrypoint sh waaseyaa-skeleton:ci \
            -c 'sed -n "s/^P://p" /lib/apk/db/installed' | sort -u > "$layers/final-packages.txt"
          test -s "$layers/final-packages.txt"
          : > "$layers/layer-packages.txt"
          : > "$layers/entries.txt"
          databases=0
          while IFS= read -r blob; do
            tar -tf "$blob" >> "$layers/entries.txt" 2>/dev/null || true
            # `|| true`: a saved image also contains non-tar blobs (the config
            # and manifest JSON), and under `set -e` a failed `tar` inside a
            # command substitution would abort the step.
            names=$(tar -xOf "$blob" lib/apk/db/installed 2>/dev/null | sed -n 's/^P://p' || true)
            if [[ -n "$names" ]]; then
              databases=$((databases + 1))
              printf '%s\n' "$names" >> "$layers/layer-packages.txt"
            fi
          done < <(find "$layers" -type f \( -name 'layer.tar' -o -path '*/blobs/*' \))
          test -s "$layers/entries.txt"
          test "$databases" -gt 0
          sort -u "$layers/layer-packages.txt" -o "$layers/layer-packages.txt"
          removed=$(comm -23 "$layers/layer-packages.txt" "$layers/final-packages.txt")
          if [[ -n "$removed" ]]; then
            echo "$removed"
            echo '::error title=Build dependencies persist in a layer::these packages are recorded in a saved layer but absent from the final image, so their files ship. The apk add and the apk del must share one RUN.'
            exit 1
          fi

          # (ii) Path-level corroboration over the same layers: the binaries and
          # headers $PHPIZE_DEPS, icu-dev and libzip-dev actually install. This
          # is a denylist and is therefore NOT the proof -- (i) is -- but it
          # fails independently of apk's own bookkeeping.
          build_only='^(usr/bin/(autoconf|autoheader|autom4te|ar|as|c\+\+|cc|dpkg|dpkg-architecture|dpkg-dev|file|g\+\+|gcc|ld|libtool|m4|make|objdump|perl|pkg-config|pkgconf|ranlib|re2c|strip)($|/)|usr/include/(unicode/|zip\.h|stdio\.h|stdlib\.h)|usr/lib/(libc\.a|libicu[a-z]*\.a|libzip\.a)($|/)|usr/lib/pkgconfig/)'
          persisted=$(grep -aE "$build_only" "$layers/entries.txt" | sort -u || true)
          if [[ -n "$persisted" ]]; then
            echo "$persisted"
            echo '::error title=Build-only path in a saved layer::a toolchain binary or development header is committed in a layer'
            exit 1
          fi
          echo "Clean: $(wc -l < "$layers/final-packages.txt") packages in the final image, the same set across $databases layer databases, and no build-only path among $(wc -l < "$layers/entries.txt") saved-layer entries."

      # #2647. The runner has a Docker daemon, so this is the lane where the
      # sentinel-secret proof actually executes: it builds a real image from a
      # real create-project context and asserts no generated .env secret reached
      # the build-context inventory, the image filesystem, or any saved layer.
      # No --allow-missing-docker here — on this lane a missing daemon must fail
      # rather than degrade to a pass. The gate is deliberately dependency-free,
      # so it runs without this job installing the repo's own vendor/ tree.
      - name: Generated .env secrets stay out of the skeleton Docker image
        run: php bin/check-skeleton-docker-secret-exclusion

  # #2644: the fresh-project lifecycle is proven on a native Windows development
  # host, not only on Linux. Windows is already a declared development host —
  # bin/check-portable-paths gates tracked paths for "the repository's supported
  # Linux, macOS, and Windows development hosts" — but no runner had ever
  # exercised it, so `site:init` shipped unable to complete there at all.
  #
  # This lane deliberately makes NO serving claim: no serve, no dev, no
  # FrankenPHP, no admin build, no Playwright, and it does not run the PHPUnit
  # suites (a documented set of those is POSIX-only by design). The S1 support
  # contract's platform.framework_os stays ubuntu-24.04 — that is the serving
  # runtime — and support/s1-v1.json is untouched.
  #
  # Every step is PowerShell and PHP. The Linux consumer harnesses are bash and
  # cannot run here, which is the point: the portable boundary is the PHP entry.
  skeleton-create-project-windows:
    name: ci/skeleton-create-project-windows
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, sodium, fileinfo, zip
          coverage: none

      # Composer's download cache. The key is already OS-scoped by runner.os,
      # and the path is the Windows cache location, not the Linux one.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Composer\files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Fresh create-project completes the lifecycle on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandArgumentPassing = 'Standard'

          function Invoke-Checked {
            param([string] $What, [scriptblock] $Body)
            & $Body
            if ($LASTEXITCODE -ne 0) { throw "$What failed with exit code $LASTEXITCODE" }
          }

          $repo = $env:GITHUB_WORKSPACE
          $work = Join-Path $env:RUNNER_TEMP ('skel-' + [guid]::NewGuid().ToString('N'))

          # The candidate must be tested against THIS checkout. The published
          # release cannot contain the Windows fixes this lane exists to prove,
          # so resolving waaseyaa/framework from Packagist would prove nothing.
          Invoke-Checked 'create-project' {
            composer create-project waaseyaa/waaseyaa $work `
              --repository='{"type":"path","url":"skeleton"}' `
              --stability=dev --no-install --no-scripts --no-interaction
          }

          # prepare.php is plain PHP and already pins symlink:false, which is
          # what makes a path repository behave on a host without developer-mode
          # symlinks.
          Invoke-Checked 'configure path repositories' {
            php (Join-Path $repo 'tests/ReferenceConsumer/prepare.php') configure $repo $work
          }
          Invoke-Checked 'composer update' {
            composer update --working-dir=$work --no-interaction --no-scripts --no-plugins
          }
          Invoke-Checked 'post-create-project-cmd' {
            composer run-script --working-dir=$work post-create-project-cmd
          }

          Push-Location $work
          try {
            # (c) Verification before site:init must instruct, not fail with a
            # shell error. On this host the old sh adapter could not run at all.
            $preInit = (composer site-verify 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 3) {
              throw "Pre-init verification must exit 3 with an instruction, got $LASTEXITCODE. Output: $preInit"
            }
            if ($preInit -notmatch 'site:init') {
              throw "Pre-init verification must name site:init. Output: $preInit"
            }

            Copy-Item (Join-Path $repo 'tests/ReferenceConsumer/site.answers.yaml') 'site.answers.yaml'
            Invoke-Checked 'bind-lock' {
              php (Join-Path $repo 'tests/ReferenceConsumer/prepare.php') bind-lock $repo $work
            }

            # The lifecycle. site:init is the step that could not complete on
            # this platform before #2644.
            Invoke-Checked 'site:init' {
              php vendor/bin/waaseyaa site:init --answers=site.answers.yaml --project-root=$work --yes
            }
            if (-not (Test-Path '.waaseyaa/generated.json')) { throw 'site:init published no ownership metadata.' }
            if (-not (Test-Path 'bin/maintenance/site-verify')) { throw 'site:init generated no verification command.' }

            # (d) The whole site-contract phase is database-free. site:init has
            # just run and the strict doctor runs next; install:init is the
            # first command allowed to create the database. This assertion is
            # what caught site:init's own restricted-boot database creation,
            # which the Linux reference consumer structurally cannot see because
            # it has already materialized the database by this point.
            if (Test-Path 'storage/waaseyaa.sqlite') {
              throw 'site:init created the application database before install:init.'
            }
            Invoke-Checked 'site:doctor' {
              php vendor/bin/waaseyaa site:doctor --strict --format=json --project-root=$work
            }
            if (Test-Path 'storage/waaseyaa.sqlite') {
              throw 'site:doctor created the application database.'
            }

            Invoke-Checked 'install:init' {
              php vendor/bin/waaseyaa install:init --no-interaction
            }
            Invoke-Checked 'composer site-verify' { composer site-verify }

            # Regeneration is idempotent without POSIX permission bits.
            Invoke-Checked 'site:init (repeat)' {
              php vendor/bin/waaseyaa site:init --answers=site.answers.yaml --project-root=$work --yes
            }
            Invoke-Checked 'composer site-verify (repeat)' { composer site-verify }
          }
          finally {
            Pop-Location
          }

          # Handed to the junction-containment step below, which needs a
          # consumer that has completed install:init and which owns the
          # cleanup this block used to do.
          "BIMAAJI_WINDOWS_CONSUMER=$work" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # #2656. resolvePathInSandbox() resolves paths with realpath() rather
      # than trusting is_link(), precisely because is_link() does not report a
      # Windows directory junction. Every other containment proof in that
      # change is a POSIX symlink on Ubuntu, and this lane runs no PHPUnit, so
      # the Windows behaviour the guard depends on was asserted and never
      # executed. This step executes it against the real bimaaji:install entry
      # point.
      #
      # It is PowerShell and PHP and makes no serving claim, so it sits inside
      # this lane's stated contract rather than widening it. Junctions rather
      # than symbolic links: a Windows symlink normally needs
      # SeCreateSymbolicLinkPrivilege or Developer Mode, a junction does not,
      # and a junction is the exact reparse-point shape the guard must catch.
      # The script carries its own positive controls, so a junction that
      # silently failed to redirect fails the gate instead of passing it.
      - name: bimaaji:install containment holds across a Windows junction
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -File bin/check-bimaaji-junction-containment.ps1 -ConsumerRoot $env:BIMAAJI_WINDOWS_CONSUMER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean up the Windows consumer
        if: always()
        run: |
          if ($env:BIMAAJI_WINDOWS_CONSUMER) {
            Remove-Item -Recurse -Force $env:BIMAAJI_WINDOWS_CONSUMER -ErrorAction SilentlyContinue
          }

  # #2658. The local-operator trust-boundary proofs spawn child PHP processes
  # (a production-shaped runtime for R-6, and a real `php -S` built-in server
  # under SAPI `cli-server` for the narrowing-only SAPI seam). Their first
  # implementation built a `NAME=value command` prefix and called exec() —
  # POSIX shell syntax that cmd.exe does not parse, so on Windows the probe was
  # never executed and the proof passed vacuously. They now use proc_open()
  # with an argv array and an explicit environment map; this lane is what makes
  # that portability a tested claim rather than an assertion.
  #
  # Deliberately NOT folded into ci/skeleton-create-project-windows: that lane
  # installs a consumer project via `composer create-project` and runs no
  # PHPUnit at all, so it has neither the monorepo autoloader nor the dev
  # dependencies these tests need. Bolting a full monorepo install onto it
  # would roughly double its runtime and blur a lane with a specific charter.
  #
  # Scope is only the boundary proofs. The D-7.3 roster-gate sandbox
  # (tests/Architecture/LocalOperatorToolProfileGateTest.php) is excluded on
  # purpose: it builds its fixture tree with symlink(), which needs Developer
  # Mode or SeCreateSymbolicLinkPrivilege on Windows, and it exercises a gate
  # that runs on the Linux lanes.
  local-operator-windows:
    name: ci/local-operator-windows
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      # The same extension set ci/skeleton-create-project-windows installs, and
      # for the same reason: the root lock file resolves waaseyaa/oidc, whose
      # lcobucci/jwt and league/oauth2-server dependencies carry ext-sodium
      # platform requirements. A shorter list makes `composer install` fail
      # with "lock file does not contain a compatible set of packages" before
      # any test runs.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, sodium, fileinfo, zip
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Composer\files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          composer install --no-interaction --no-progress --no-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Local-operator trust boundary holds on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          php vendor/bin/phpunit --no-coverage `
            packages/ai-agent/tests/Unit/LocalOperator `
            tests/Integration/LocalOperator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  packaged-form:
    name: packaged-form
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Exact key only (runner OS + PHP version + this fixture's own
      # composer.lock hash) — no restore-keys, same rationale as the
      # root-graph jobs: a broad prefix can hand this job a vendor/ tree
      # built from a different lock file.
      - name: Cache packaged-form Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/PackagedForm/skeleton/vendor
          key: ${{ runner.os }}-php-8.5-packaged-form-vendor-${{ hashFiles('tests/PackagedForm/skeleton/composer.lock') }}

      - name: Install packaged-form dependencies
        uses: ./.github/actions/composer-install-retry
        with:
          working-directory: tests/PackagedForm/skeleton

      - name: Run packaged-form tests
        working-directory: tests/PackagedForm/skeleton
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist

  site-reference-consumer:
    name: site-reference-consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # GitHub is only a hosted adapter. This same executable is the authority
      # locally and on Forgejo, Gitea, GitLab, Jenkins, or another runner.
      - name: Prove the clean provider-neutral reference consumer
        run: tests/ReferenceConsumer/check-reference-consumer

  fresh-install-boot:
    # #2426: a fresh packaged-form consumer must boot. Access-policy discovery
    # runs inside AbstractKernel::boot(), so a policy whose dependency graph
    # demands post-activation configuration state makes a brand-new install
    # permanently unbootable — activating configuration itself requires a booted
    # kernel. core-only-boot cannot see this class of defect: waaseyaa/core does
    # not ship waaseyaa/workflows, so the policy that triggered it is never
    # constructed there. Builds the full framework from path repositories, so it
    # proves the source tree with no release lag and no Packagist dependency.
    # See tests/PackagedForm/check-fresh-install-boot and tests/FreshInstallBoot/boot.php.
    name: ci/fresh-install-boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Installs into a fresh mktemp consumer with its own dependency graph, so
      # it cannot consume prepare-test-plan's vendor archive. Exact key only —
      # no restore-keys — same rationale as the other consumer-shaped jobs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Boot a fresh packaged-form install
        run: bash tests/PackagedForm/check-fresh-install-boot

      # #2786/#2809: an external package's #[FieldType] must be discovered by
      # the compiled manifest, admitted by the boot-scoped registry, and
      # projected through entity schema, API, and GraphQL in both development
      # and optimized production-shaped consumers.
      - name: Prove downstream custom field admission in dev and prod consumers
        run: bash tests/PackagedForm/check-custom-field-admission

  bimaaji-skill-resources:
    # #2656: `bimaaji:install` must work from a real packaged consumer. The
    # canonical Agent Skills used to live at the monorepo root, so the command
    # only ever succeeded in the repository that did not need it. This job
    # builds a consumer from the candidate tree with path repositories set to
    # symlink=false — vendor/waaseyaa/bimaaji holds installed BYTES, not a link
    # back into the checkout — seeds no skill fixtures, and drives the command
    # from those bytes. It also proves the marker-bounded refresh preserves
    # hand-authored content and that a deleted or corrupt resource produces the
    # matching diagnostic. The fast repo-state half runs inside ci/unit-tests
    # as packages/bimaaji/tests/Architecture/PackagedSkillResourcesTest.php.
    # See tests/PackagedForm/check-bimaaji-skill-resources.
    name: ci/bimaaji-skill-resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Installs into a fresh mktemp consumer with its own dependency graph, so
      # it cannot consume prepare-test-plan's vendor archive. Exact key only —
      # no restore-keys — same rationale as the other consumer-shaped jobs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Install bimaaji skills from installed package resources
        run: bash tests/PackagedForm/check-bimaaji-skill-resources

  cli-health-report:
    # #2820: `health:report` must run in a consumer application that adds no
    # container bindings of its own. The command crashed in every such
    # consumer ("Cannot auto-wire HealthReportHandler: unresolvable parameter
    # $projectRoot") while the monorepo and the unit suite stayed green — and a
    # first fix, proven only by a unit test over a fake kernel-services bus,
    # shipped without changing that. This job builds a --no-dev consumer from
    # the candidate tree with path repositories, requires only waaseyaa/core +
    # waaseyaa/cli, strips the skeleton's application source so nothing but
    # installed bytes can carry the binding, runs install:init, and executes
    # `health:report`, `health:report --json` (stdout must parse as one JSON
    # document naming the consumer's own project root), and
    # `health:report --json --output`. The fast in-tree half runs inside
    # ci/unit-tests as tests/Architecture/CliHealthReportGateTest.php and
    # tests/Integration/OperatorDiagnostics/HealthReportCommandWiringTest.php.
    # See tests/PackagedForm/check-cli-health-report.
    name: ci/cli-health-report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Installs into a fresh mktemp consumer with its own dependency graph, so
      # it cannot consume prepare-test-plan's vendor archive. Exact key only —
      # no restore-keys — same rationale as the other consumer-shaped jobs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Run health:report in a packaged-form consumer
        run: bash tests/PackagedForm/check-cli-health-report

  cli-sync-rules:
    # #2832: prove package-owned rules from candidate bytes in direct and aggregate consumers.
    name: ci/cli-sync-rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Installs into a fresh mktemp consumer with its own dependency graph, so
      # it cannot consume prepare-test-plan's vendor archive. Exact key only —
      # no restore-keys — same rationale as the other consumer-shaped jobs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Run sync-rules in packaged-form consumers
        run: bash tests/PackagedForm/check-cli-sync-rules

  split-artifact-acceptance:
    # #2649 (child of #2527). Release Gate 2 must prove that the EXACT candidate
    # SURVIVES PACKAGING, not merely that it boots. ci/fresh-install-boot builds
    # its consumer from path repositories, so vendor/waaseyaa is symlinked into
    # the checkout and nothing about `git archive`, export, or the split
    # boundary is exercised. Skeleton Smoke installs genuinely published bytes
    # but runs AFTER the tag, so it cannot gate one.
    #
    # This job seals HEAD into a local Composer ARTIFACT repository (one zip per
    # member, produced by `git archive`, canonical for waaseyaa/* via `only`),
    # runs `composer create-project` against it, and asserts composition,
    # exported files, bootstrap, and --no-dev exclusion against extracted bytes.
    # Two surfaces #2649 names are RESERVED and recorded as such in
    # tests/PackagedForm/fixtures/split-artifact-acceptance-surfaces.json: the
    # development metapackage (#2655, which depends on #2649 — asserting it here
    # would be circular) and stdio initialization (#2659, gated behind #2657).
    #
    # It creates no tag and publishes nothing. It blocks tag creation only by
    # being part of this workflow, which release-cut.yml's "Gate 2/5: require
    # green CI on the exact commit being tagged" waits on before the
    # release-identity token is minted.
    #
    # See tests/PackagedForm/check-split-artifact-acceptance.
    name: ci/split-artifact-acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, zip
          coverage: none

      # Installs into a fresh mktemp consumer with its own dependency graph, so
      # it cannot consume prepare-test-plan's vendor archive. Exact key only —
      # no restore-keys — same rationale as the other consumer-shaped jobs.
      # waaseyaa/* never touches this cache: the artifact repository is
      # canonical for those names, so only third-party dependencies are fetched.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      # No --allow-dirty: the seal must prove the bytes under review. The
      # harness's final step re-runs every live assertion against deliberately
      # corrupted overlays and fails if any survives, so a green result here is
      # a harness that was observed failing on this same run.
      - name: Packaged create-project acceptance on split-shaped artifacts
        run: |
          set -euo pipefail
          bash tests/PackagedForm/check-split-artifact-acceptance | tee /tmp/split-artifact-acceptance.log
          {
            echo "### Split-artifact acceptance (#2649)"
            echo
            echo '```'
            sed -n '/Acceptance surfaces/,$p' /tmp/split-artifact-acceptance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  studio-alpha-acceptance:
    # #2789. Packaged Studio-alpha acceptance: ONE disposable consumer,
    # installed from the EXACT candidate sealed into a local Composer artifact
    # repository by the same engine ci/split-artifact-acceptance uses, driven
    # serially through install, verification, seeded real identities, a real
    # browser operating the artifact-installed admin bundle, the typed
    # concealed 404 against a real unprivileged identity, hand extension,
    # snapshot, an interrupted publication recovered by a later process, an
    # additive upgrade, a zero-write GEN011 refusal, and final restoration.
    #
    # It proves the story holds together in packaged form, which no in-tree
    # suite can: those resolve sibling packages from the checkout, so nothing
    # about export, archive bytes or the split boundary is exercised.
    #
    # It creates no tag and publishes nothing. --allow-dirty is never passed:
    # a dirty seal would prove bytes that are not the bytes under review.
    #
    # See tests/PackagedForm/check-studio-alpha-acceptance.
    name: ci/studio-alpha-acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      # Installs into a fresh mktemp consumer with its own dependency graph, so
      # it cannot consume prepare-test-plan's vendor archive. Exact key only —
      # no restore-keys. waaseyaa/* never touches this cache: the artifact
      # repository is canonical for those names.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      # The repository's own pinned Playwright, not an ad-hoc download: the
      # harness refuses to run if this toolchain is absent.
      - name: Install the pinned admin toolchain
        run: npm ci --prefix packages/admin

      - name: Install the pinned Playwright browser
        run: npx --prefix packages/admin playwright install chromium

      # The candidate SHA reaches the shell as an environment variable, never
      # interpolated into the script body.
      - name: Studio-alpha packaged acceptance
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          bash tests/PackagedForm/check-studio-alpha-acceptance | tee /tmp/studio-alpha-acceptance.log
          {
            echo "### Studio-alpha packaged acceptance (#2789)"
            echo
            echo "Candidate: \`${CANDIDATE_SHA}\`"
            echo
            echo '```'
            sed -n '/Studio-alpha acceptance surfaces/,$p' /tmp/studio-alpha-acceptance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: studio-alpha-acceptance-diagnostics
          path: /tmp/studio-alpha-acceptance.log
          if-no-files-found: warn

  core-only-boot:
    # Boots the kernel from a consumer that requires ONLY waaseyaa/core, installed via a path
    # repository so it tests the SOURCE core metapackage (no release lag). Guards the class of
    # bug where core omits a fail-closed kernel boot dependency (e.g. waaseyaa/scheduler, fixed
    # in this train) — the gap that source-tree co-resolution masks. See tests/CoreOnlyBoot/boot.php.
    name: ci/core-only-boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # This job installs into a fresh mktemp working dir (a different
      # dependency graph — waaseyaa/core alone), so it cannot consume
      # prepare-test-plan's vendor archive. The only stable, cacheable thing
      # across runs is Composer's own package download cache, not the
      # ephemeral work dir. Exact key only — no restore-keys — same
      # rationale as the root-graph jobs.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}

      - name: Install waaseyaa/core alone and boot the kernel
        run: |
          set -euo pipefail
          # Bounded retry with backoff around the network-touching install
          # below (same pattern as ci/skeleton-create-project): PR #2406 hit
          # repeated HTTP/2 429s from codeload.github.com.
          composer_retry() {
            local attempt=1
            local max_attempts=3
            local delay=5
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "::warning title=Composer command failed (attempt ${attempt}/${max_attempts})::retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          work=$(mktemp -d)
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT
          # CI checks out a detached merge ref, so the packages/* path repos are version-guessed
          # as a bare dev-<sha> pseudo-version that matches no numeric constraint. Put HEAD on a
          # local `main` so they resolve via the existing dev-main -> 0.1.x-dev branch-alias and
          # satisfy the internal ^<tag> sibling constraints (the canonical path repo otherwise
          # blocks Packagist fallback). Tree is unchanged — same commit, so the checkout is clean.
          git -C "$GITHUB_WORKSPACE" checkout -B main
          printf '{"name":"waaseyaa/core-only-boot-fixture","type":"project","require":{"waaseyaa/core":"*"},"repositories":[{"type":"path","url":"%s/packages/*","options":{"symlink":false}}],"minimum-stability":"dev","prefer-stable":true}\n' "$GITHUB_WORKSPACE" > "$work/composer.json"
          composer_retry composer install --working-dir "$work" --no-interaction
          test -d "$work/vendor/waaseyaa/scheduler" || { echo "::error::core-only install did not pull waaseyaa/scheduler (core metapackage is missing a fail-closed kernel boot dependency)"; exit 1; }
          mkdir -p "$work/config" "$work/config/sync" "$work/storage" "$work/storage/files"
          cp "$GITHUB_WORKSPACE/skeleton/config/waaseyaa.php" "$work/config/waaseyaa.php"
          # The fixture is an explicit testing profile. Production/local boots
          # require a real active configuration generation and fail closed.
          printf 'APP_ENV=testing\nAPP_DEBUG=false\n' > "$work/.env"
          cp "$GITHUB_WORKSPACE/tests/CoreOnlyBoot/boot.php" "$work/boot.php"
          cp "$GITHUB_WORKSPACE/tests/CoreOnlyBoot/prepare-runtime-schema.php" "$work/prepare-runtime-schema.php"
          php "$work/prepare-runtime-schema.php"
          WAASEYAA_DB="$work/storage/core-only.sqlite" php "$work/boot.php"

  frankenphp-worker:
    # #2494: real FrankenPHP worker-runtime acceptance against the shipped
    # production front controller. PHP built-in server and mocked processes
    # are not substitutes. Missing binary is an infrastructure failure.
    name: ci/frankenphp-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Install pinned FrankenPHP
        env:
          FRANKENPHP_BIN: ${{ runner.temp }}/frankenphp-v1.12.4
        run: |
          set -euo pipefail
          pin=tools/frankenphp-runtime-pin.json
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$pin")"
          url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$pin")"
          sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$pin")"
          echo "Pinned FrankenPHP ${version} from ${url}"
          curl -fsSL -o "$FRANKENPHP_BIN" "$url"
          echo "${sha}  ${FRANKENPHP_BIN}" | sha256sum -c -
          chmod +x "$FRANKENPHP_BIN"
          "$FRANKENPHP_BIN" version
          echo "FRANKENPHP_BIN=$FRANKENPHP_BIN" >> "$GITHUB_ENV"

      - name: Harness self-tests
        run: bash scripts/acceptance-frankenphp-worker.sh --self-test

      - name: Real FrankenPHP worker acceptance
        run: bash scripts/acceptance-frankenphp-worker.sh
        env:
          FRANKENPHP_BINARY: ${{ env.FRANKENPHP_BIN }}

      - name: Adversarial leak fixture must fail the lane
        env:
          FRANKENPHP_BINARY: ${{ env.FRANKENPHP_BIN }}
          WAASEYAA_FRANKENPHP_ACCEPTANCE_PORT: '3057'
          WAASEYAA_FRANKENPHP_CLASSIC_PORT: '3058'
        run: |
          set +e
          bash scripts/acceptance-frankenphp-worker.sh --inject-leak
          status=$?
          set -e
          if [ "$status" -ne 42 ]; then
            echo "Adversarial leak fixture did not fail closed with exit 42 (got ${status})." >&2
            exit 1
          fi
          echo "Leak fixture went red as required."

      - name: Worker processes must not survive the harness
        env:
          FRANKENPHP_BINARY: ${{ env.FRANKENPHP_BIN }}
        run: |
          set -euo pipefail
          leftover="$(ps -eo pid= | while read -r pid; do
            exe="$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)"
            if [ "$exe" = "$(readlink -f "$FRANKENPHP_BINARY")" ]; then
              echo "$pid"
            fi
          done)"
          if [ -n "${leftover}" ]; then
            echo "FrankenPHP still running after the acceptance harness: ${leftover}" >&2
            exit 1
          fi
          if ss -ltn 2>/dev/null | grep -qE ':3055[[:space:]]|:3056[[:space:]]|:3057[[:space:]]|:3058[[:space:]]'; then
            echo "Acceptance ports still listening after the harness." >&2
            ss -ltn || true
            exit 1
          fi

  verify-gates:
    name: ci/verify-gates
    # The permanent "verify-only" boundary gates that `composer verify` runs but CI
    # historically did NOT, so they could not gate PRs (audit C-17 — CI was a strict subset
    # of verify). Wired here after confirming each green at HEAD. Run via the `composer
    # <script>` aliases so this job stays byte-identical to what `composer verify` enforces.
    # The delivery-event gate is the one exception: its dedicated step supplies
    # the exact candidate and event base; local checks use their merge-base.
    # (check-phpstan-paths — the PHPStan coverage invariant — was added for audit C-19.)
    # (check-admin-dist-fresh — the D6 admin-SPA-dist freshness gate — was added here so a stale committed admin dist fails the PR in blocking CI, not only via the out-of-band admin-dist.yml fix-up workflow.)
    # (check-admin-dist-manifest — the #2524 acceptance-manifest gate — re-derives packages/admin-surface/dist.manifest.json from the committed bytes: published-tree digest/counts, source-signature parity, Nuxt build identity, and every declared source-contract marker. Additive to check-admin-dist-fresh, which stays authoritative for staleness.)
    #
    # check-external-consumers is intentionally NOT here: it is a mission-scoped pre-deletion
    # tripwire (WP01 ai-tools migration, key 'ai-agent-orphans'), not a permanent invariant —
    # its accessCheck(false) scan flags legitimate system-context usage framework-wide
    # (seo/path/user/groups/field) because its excludes snapshot went stale. It was
    # reclassified out of `composer verify` so verify == this CI gate set; run it on demand via
    # `composer check-external-consumers`. See roadmap triage for the retire/narrow follow-up.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Exact key only — see composer-deps-audit's identical block for the
      # rationale (no broad restore-keys; retry absorbs a cache miss).
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Run the permanent verify-only boundary gates
        run: |
          set -uo pipefail
          fail=0
          run_gate() {
            echo "::group::composer $1"
            if composer "$1"; then
              echo "PASS: $1"
            else
              echo "::error::verify gate failed: composer $1"
              fail=1
            fi
            echo "::endgroup::"
          }
          run_gate check-phpstan-paths
          run_gate check-portable-paths
          run_gate check-phpunit-paths
          run_gate check-phpunit-skip-policy
          run_gate check-s1-configuration-authority
          run_gate check-package-layers-pl008-self-test
          run_gate check-distribution-extensions
          run_gate check-local-operator-tool-profile
          run_gate check-symfony-imports
          run_gate check-getquery-bindings
          run_gate check-dispatcher-keys
          run_gate check-admin-coercion-patterns
          run_gate check-admin-coercion-self-test
          run_gate check-admin-dist-fresh
          run_gate check-admin-dist-manifest
          run_gate check-field-guards
          run_gate check-access-hardening
          run_gate check-openapi
          run_gate check-delivery-agent-projection
          exit "$fail"

      - name: Verify append-only delivery agent events
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXACT_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          case "$EVENT_NAME" in
            pull_request)
              php bin/check-delivery-agent-events --base="$EVENT_BASE_SHA" --candidate="$EXACT_SHA" --head="$PR_HEAD_SHA"
              ;;
            push)
              # Preserve the whole push baseline, including multi-commit pushes.
              php bin/check-delivery-agent-events --base="$EVENT_BASE_SHA" --candidate="$EXACT_SHA"
              ;;
            workflow_dispatch)
              # A dispatch qualifies this immutable transition, not a push range.
              EVENT_BASE_SHA="$(git rev-parse "$EXACT_SHA^1")"
              php bin/check-delivery-agent-events --base="$EVENT_BASE_SHA" --candidate="$EXACT_SHA"
              ;;
            *) echo "Unsupported delivery custody event: $EVENT_NAME" >&2; exit 1 ;;
          esac

  ci-playwright-smoke:
    name: ci/playwright-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Exact key only — see composer-deps-audit's identical block for the
      # rationale (no broad restore-keys; retry absorbs a cache miss).
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/admin/node_modules
          key: node-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Install Node dependencies
        timeout-minutes: 5
        run: cd packages/admin && npm ci --no-audit --no-fund

      # The hosted Ubuntu image already carries Chromium/Firefox runtime
      # libraries. Avoid Playwright's --with-deps apt path: a stalled Ubuntu
      # mirror would otherwise hold this required context for hours.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: cd packages/admin && npx playwright install chromium firefox

      - name: Start PHP backend
        run: |
          php -S 127.0.0.1:8080 -t public/ > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run Playwright smoke tests
        run: cd packages/admin && npx playwright test --project=chromium --project=firefox

      - name: Summarize Playwright retries
        if: always()
        run: cd packages/admin && npm run test:e2e:summary

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-smoke-results
          path: |
            packages/admin/test-results/
            packages/admin/playwright-report/
          retention-days: 30

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-logs
          path: |
            /tmp/php-server.log
            /tmp/nuxt-server.log
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/admin/node_modules
          key: node-${{ hashFiles('packages/admin/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Admin SPA
        run: npm run build

      - name: Measure frontend unit-test coverage
        run: npm run test:coverage

      - name: Enforce changed admin coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/check-changed-coverage.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-build
          path: packages/admin/.output/
          retention-days: 14

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: packages/admin/coverage/
          retention-days: 30

  manifest-conformance:
    name: Manifest conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Validate defaults manifests have project_versioning
        run: |
          fail=0
          for f in defaults/*.yaml; do
            if ! grep -q 'project_versioning' "$f"; then
              echo "FAIL: $f is missing project_versioning block"
              fail=1
            fi
          done
          exit $fail

      - name: Validate defaults JSON Schemas are well-formed
        run: |
          fail=0
          for f in defaults/*.schema.json; do
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "FAIL: $f is not valid JSON"
              fail=1
            fi
          done
          exit $fail

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install ajv-cli
        run: npm install -g ajv-cli

      - name: Validate defaults JSON Schemas are valid draft-07
        run: |
          fail=0
          for f in defaults/*.schema.json; do
            if ! ajv compile --spec=draft7 --strict=false -s "$f" > /dev/null 2>&1; then
              echo "FAIL: $f is not a valid JSON Schema draft-07"
              fail=1
            fi
          done
          exit $fail

  ingestion-defaults:
    name: Ingestion defaults
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Validate ingestion schema metadata and compatibility rules
        run: bash bin/check-ingestion-defaults

  release-publish-shape:
    name: Release publish shape
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Assert exactly-once Packagist publish + forward-only release shape
        run: bash bin/check-release-publish-shape

  security-defaults:
    name: Security defaults
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Check no secrets in defaults/
        run: bash bin/check-no-secrets

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      # Exact key only — see composer-deps-audit's identical block for the
      # rationale (no broad restore-keys; retry absorbs a cache miss).
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-vendor-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        uses: ./.github/actions/composer-install-retry

      - name: Run structural secrets scan
        run: ./vendor/bin/phpunit --filter Phase22 --no-coverage
