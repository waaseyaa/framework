# Monorepo GitHub Releases for version tags are created by the `publish-github-release`
# job in split.yml (after split + verify-tag-parity). This file is workflow_dispatch-only
# so tag pushes do not race parity checks before split repos have the tag.
#
# Use when split + parity succeeded but the release step failed, or to backfill a release.
name: GitHub Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v0.1.0-alpha.115)'
        required: true
        type: string
      evidence_run_id:
        description: 'Successful split workflow run containing waaseyaa-release-evidence'
        required: false
        type: string
      split_run_id:
        description: 'Split workflow run containing complete split-provenance-* artifacts (recovery path)'
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify split tag parity before release
        env:
          TAG_NAME: ${{ inputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: |
          bash bin/check-release-tag-parity "${TAG_NAME}"

      - name: Select exactly one evidence source
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          SPLIT_RUN_ID: ${{ inputs.split_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "${EVIDENCE_RUN_ID}" && -n "${SPLIT_RUN_ID}" ]]; then
            echo "::error::Provide evidence_run_id or split_run_id, never both."
            exit 1
          fi
          if [[ -z "${EVIDENCE_RUN_ID}" && -z "${SPLIT_RUN_ID}" ]]; then
            echo "::error::One evidence source is required."
            exit 1
          fi
          for run_id in "${EVIDENCE_RUN_ID}" "${SPLIT_RUN_ID}"; do
            [[ -z "${run_id}" ]] && continue
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Workflow run ids must be positive integers."
              exit 1
            }
          done

      - name: Download retained release evidence
        if: ${{ inputs.evidence_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waaseyaa-release-evidence
          path: release-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Download retained split provenance for recovery
        if: ${{ inputs.split_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: split-provenance-*
          path: release-split-provenance
          merge-multiple: true
          run-id: ${{ inputs.split_run_id }}
          github-token: ${{ github.token }}

      - name: Set up PHP and Composer for recovery
        if: ${{ inputs.split_run_id != '' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Set up Node.js for recovery
        if: ${{ inputs.split_run_id != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify Packagist and reconstruct deterministic evidence
        if: ${{ inputs.split_run_id != '' }}
        env:
          SPLIT_RUN_ID: ${{ inputs.split_run_id }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          {
            jq -r '.name // empty' composer.json
            for manifest in packages/*/composer.json; do jq -r '.name // empty' "${manifest}"; done
          } | grep '^waaseyaa/' | sort -u > /tmp/release-packages.txt

          while IFS= read -r package; do
            curl -fsS --max-time 30 "https://repo.packagist.org/p2/${package}.json" \
              | jq -e --arg package "${package}" --arg tag "${TAG_NAME}" \
                '.packages[$package][]? | select(.version == $tag)' >/dev/null || {
                  echo "::error::${package} ${TAG_NAME} is not visible in Packagist P2."
                  exit 1
                }
          done < /tmp/release-packages.txt

          source_sha="$(git rev-parse "${TAG_NAME}^{commit}")"
          bin/generate-release-evidence \
            --repository-root="${GITHUB_WORKSPACE}" \
            --split-provenance-dir="${GITHUB_WORKSPACE}/release-split-provenance" \
            --output-dir="${GITHUB_WORKSPACE}/release-evidence" \
            --source-repository="${GITHUB_REPOSITORY}" \
            --source-sha="${source_sha}" \
            --tag="${TAG_NAME}" \
            --builder-id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/split.yml" \
            --workflow-run-id="${SPLIT_RUN_ID}" \
            --composer-version="$(composer --version --no-ansi | awk '{print $3}')" \
            --node-version="$(node --version)"

      - name: Retain reconstructed release evidence
        if: ${{ inputs.split_run_id != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waaseyaa-release-evidence
          path: |
            release-evidence/waaseyaa-framework.cdx.json
            release-evidence/waaseyaa-framework-provenance.json
            release-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Verify retained release evidence
        env:
          PROVENANCE_RUN_ID: ${{ inputs.evidence_run_id || inputs.split_run_id }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          (
            cd release-evidence
            sha256sum --check SHA256SUMS
          )
          source_sha="$(git rev-parse "${TAG_NAME}^{commit}")"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${source_sha}" \
            --arg tag "${TAG_NAME}" \
            --arg run_id "${PROVENANCE_RUN_ID}" \
            '.source.repository == $repository
              and .source.sha == $source_sha
              and .release.tag == $tag
              and .builder.workflow_run_id == $run_id
              and .evidence.sbom.path == "waaseyaa-framework.cdx.json"' \
            release-evidence/waaseyaa-framework-provenance.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag, 'alpha') || contains(inputs.tag, 'beta') || contains(inputs.tag, 'rc') }}
          files: release-evidence/*
          fail_on_unmatched_files: true
