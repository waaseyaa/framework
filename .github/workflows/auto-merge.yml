name: Auto-merge when green

# Native GitHub auto-merge (#1934): this workflow *enables* auto-merge on
# labeled PRs. GitHub then re-evaluates as checks complete and merges when the
# main-protection ruleset's complete required-check set passes — no stale
# duplicated check list and no fire-once race.
#
# Post-merge CI on main is restored by chain-dispatch, not a PAT: merges made
# with the default GITHUB_TOKEN suppress push-triggered workflows, but GitHub
# documents that "workflow_dispatch and repository_dispatch events always
# create workflow runs" (Actions docs, GITHUB_TOKEN trigger suppression).
# So after the merge lands, this job dispatches ci.yml on the merge commit
# SHA with the plain default token. RELEASE_PAT is abandoned (#1937).

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to enable auto-merge on'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable-auto-merge:
    name: Enable native auto-merge
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'auto-merge-when-green'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
    steps:
      - name: Enable auto-merge (squash)
        run: |
          set -euo pipefail
          # --auto errors if the PR is already in clean (mergeable) status;
          # in that case merge immediately instead.
          if ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
          fi

      - name: Chain-dispatch main CI on the merge commit
        run: |
          set -euo pipefail
          # The merge lands whenever the required checks go green, so poll for
          # it (up to 2h), then dispatch ci.yml on the exact merge commit SHA.
          # workflow_dispatch is exempt from GITHUB_TOKEN trigger suppression,
          # so the dispatched run fires even though this job uses the default
          # token — no PAT required.
          merged_sha=""
          for _ in $(seq 1 120); do
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergeCommit)
            pr_state=$(jq -r '.state' <<<"$pr_json")
            if [ "$pr_state" = "MERGED" ]; then
              merged_sha=$(jq -r '.mergeCommit.oid' <<<"$pr_json")
              break
            fi
            if [ "$pr_state" = "CLOSED" ]; then
              echo "PR #$PR_NUMBER closed without merging — nothing to dispatch."
              exit 0
            fi
            sleep 60
          done
          if [ -z "$merged_sha" ]; then
            echo "::warning::PR #$PR_NUMBER still open after 2h — dispatch main CI manually once it merges:"
            echo "::warning::gh workflow run ci.yml --ref main -f sha=<merge commit sha>"
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$merged_sha"
          echo "Dispatched main CI for merge commit $merged_sha."
