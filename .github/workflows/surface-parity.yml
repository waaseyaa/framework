name: surface-parity

# Enforces charter §8.1 — public-surface-map.php must remain in sync with the
# framework's actual exported surface. Fails the PR when:
#   - A symbol exists in source but is missing from the map (untracked surface)
#   - A symbol exists in the map but is missing from source (removed without
#     a deprecation entry)
#   - A symbol's tier classification was downgraded without a deprecation
#     entry in the matching changelog
#
# Governed by docs/specs/stability-charter.md §8.1 and §11 Q3.

on:
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'packages/**/testing/**'
      - 'src/**'
      - 'docs/public-surface-map.php'
      - 'docs/public-surface-map.md'
      - 'CHANGELOG.md'
      - 'changes/unreleased/**'
      - 'tools/check-surface-parity.php'
      - '.github/workflows/surface-parity.yml'

jobs:
  surface-parity:
    runs-on: ubuntu-latest
    # BLOCKING since audit C-14: tools/check-surface-parity.php is now a real
    # php-parser AST scanner (interface/abstract/trait/enum across packages/*/src
    # and packages/*/testing), enforcing both parity directions. The prior
    # warn-only skeleton emitted false positives and could not gate.
    name: Public-surface-map parity check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run surface parity check
        run: php tools/check-surface-parity.php --base=origin/${{ github.base_ref }}

      - name: Annotate PR on failure
        if: failure()
        run: |
          echo "::error::Public-surface-map parity check failed."
          echo "::error::See docs/specs/stability-charter.md §8.1 for the policy."
          echo "::error::Fix: keep the map loadable or add the exact current-change directive documented in stability-charter.md §8.1."
