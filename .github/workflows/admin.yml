name: Admin SPA

on:
  push:
    branches: [main, 'develop/*']
    tags: ['v*']
    paths:
      - 'packages/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'packages/admin/**'
      - '.github/workflows/admin.yml'

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: admin/contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npx nuxi typecheck

      - name: Build contracts
        run: npm run build:contracts

      - name: Validate bootstrap JSON schema
        run: |
          cat > /tmp/bootstrap-test.json <<'PAYLOAD'
          {
            "version": "1.0",
            "auth": { "strategy": "redirect", "loginUrl": "/login" },
            "account": { "id": "1", "name": "Admin", "roles": ["admin"] },
            "tenant": { "id": "default", "name": "Test", "scopingStrategy": "server" },
            "transport": { "strategy": "jsonapi", "apiPath": "/api" },
            "entities": []
          }
          PAYLOAD
          npx --yes ajv-cli validate \
            --spec=draft2020 \
            --strict=false \
            -s contracts/bootstrap.schema.json \
            -d /tmp/bootstrap-test.json

      - name: Run Vitest contract tests
        run: npx vitest run --reporter=verbose

      # PHP bridge tests run in ci/unit-tests (main CI workflow).
      # Path repos don't resolve in PR detached HEAD checkouts,
      # so we don't duplicate composer install here.

      - name: Upload contracts build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: contracts-dist
          path: packages/admin/dist/
          retention-days: 14

  build:
    name: admin/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Admin SPA
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: admin-build
          path: packages/admin/.output/
          retention-days: 14

  integration:
    name: admin/integration
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-v2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-v2-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Install dependencies and Playwright
        run: cd packages/admin && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Run Playwright integration tests
        run: cd packages/admin && npx playwright test --project=chromium

      - name: Summarize Playwright retries
        if: always()
        run: cd packages/admin && npm run test:e2e:summary

  adapters:
    name: admin/adapters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run adapter unit tests
        run: npx vitest run tests/unit/adapters/

  release:
    name: admin/release
    runs-on: ubuntu-latest
    needs: [contracts, adapters, build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Contract freeze check
        run: |
          # Verify contracts/bootstrap.schema.json matches the tagged version
          # Fail if contract files have uncommitted changes
          git diff --exit-code contracts/

      - name: Build contracts
        run: npm run build:contracts

      - name: Tarball integrity check
        run: |
          # Pack and verify tarball contents
          npm pack --dry-run 2>&1 | tee /dev/stderr

      - name: Build Admin SPA
        run: npm run build

      # TODO: Publish step — enable when npm registry is configured
      # - name: Publish to npm
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
