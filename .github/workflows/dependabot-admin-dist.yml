name: Dependabot admin dist rebuild

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'packages/admin/package.json'
      - 'packages/admin/package-lock.json'

permissions:
  contents: read

jobs:
  build:
    name: Build admin dist without write credentials
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'

      - name: Install PHP build runtime
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      # Dependency code runs only in this read-only job. No later step in this
      # workspace receives a write token, so hooks/GITHUB_ENV cannot bridge the
      # trust boundary into publication.
      - name: Build admin SPA dist and freshness signature
        run: |
          NODE_BINARY="$(command -v node)"
          NPM_BINARY="$(realpath "$(command -v npm)")"
          PATH="$(dirname "$NODE_BINARY"):/usr/local/bin:/usr/bin:/bin"
          export NODE_BINARY NPM_BINARY PATH
          bin/build-admin-dist

      - name: Export only the generated public artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-dist
          path: |
            packages/admin-surface/dist
            packages/admin-surface/dist.signature
            packages/admin-surface/dist.manifest.json
          if-no-files-found: error
          retention-days: 1

  # Verification is only meaningful when the verifier comes from a trusted
  # source and the thing being verified is treated purely as data.
  #
  # `build` runs `npm ci --ignore-scripts` — so install-time lifecycle hooks
  # are NOT the exposure — and then `npm run generate`, and that is: the
  # bundler imports and executes dependency modules in-process to produce the
  # SPA. Dependency code therefore executes in `build`'s workspace, and
  # anything on that disk afterwards — bin/admin-dist-acceptance and the
  # classes it loads included — is potentially attacker-controlled. A verifier
  # the attacker can rewrite proves nothing, which is why verification cannot
  # happen in the job that ran the build.
  #
  # So this job re-obtains the verifier from git, materialises its whole PHP
  # toolchain before any generated byte reaches this disk, and then treats the
  # artifact strictly as data: confined to three paths, read and hashed, never
  # executed.
  #
  # It is also where the pinned interpreter lives. `publish` sets up no PHP by
  # design, so the `php bin/admin-dist-acceptance verify` it used to run
  # executed the runner's default interpreter and died parsing this
  # repository's PHP 8.4+ syntax, blocking every Dependabot admin bump behind
  # a stale dist (#2704). Adding setup-php to `publish` would put a
  # third-party action inside the privileged boundary; that separation is the
  # security property, so the interpreter stays out here instead.
  validate:
    name: Verify the rebuilt dist from a clean checkout
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # The identity of the exact bytes this job blessed. `publish` re-derives
      # it and refuses to install anything else, so validation and publication
      # provably concern one artifact rather than two things named alike.
      artifact-digest: ${{ steps.confine.outputs.artifact-digest }}
    steps:
      # TRUSTED HALF — the verifier's own code, by revision, not merely "a
      # fresh checkout". The revision pinned is the PR head sha: the same
      # revision `build` built from and the same one `publish` commits onto,
      # so the acceptance manifest is judged against the source contract of
      # the commit it claims to describe. Pinning the ref is what makes that
      # true; the default ref for pull_request_target is the BASE branch,
      # which would verify the bundle against a different revision's
      # dist.markers.json. persist-credentials: false so no token is left in
      # .git/config for anything here to reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'

      # bin/admin-dist-acceptance requires vendor/autoload.php, so a Composer
      # bootstrap is unavoidable; it is ordered before the download so the
      # toolchain is complete while the only bytes on this disk are git's, and
      # it carries --no-scripts --no-plugins (matching `build`) because
      # Composer scripts and plugins execute code, which is precisely what
      # this job exists to keep out. No npm and no node run here at all.
      - name: Install PHP verification runtime
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      # UNTRUSTED HALF — generated output, downloaded as data and never executed.
      - name: Download the generated artifacts as untrusted data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admin-dist
          path: ${{ runner.temp }}/admin-dist

      # Confine, then place. The upload exports exactly three entries with
      # if-no-files-found: error; this refuses anything else before a single
      # byte is copied, so an artifact carrying extra or unexpected entries
      # cannot write outside those three paths. The recursive non-regular-file
      # check is what stops `cp -a` following a symlink out of the tree.
      #
      # AdminDistAcceptanceVerifier reads packages/admin-surface/{dist,
      # dist.signature,dist.manifest.json} under the project root, so the
      # bytes are placed at exactly those paths — overwriting the committed
      # dist in this throwaway workspace only, which nothing here commits or
      # pushes. The manifest and the tree it describes travel together in one
      # artifact and land side by side, so what is verified is still "the
      # bytes that just landed", not the bytes some other tree produced
      # (#2524).
      - name: Confine the artifact and place it where the verifier reads
        id: confine
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/admin-dist
        run: |
          set -euo pipefail
          test -d "$ARTIFACT_ROOT/dist"
          test -f "$ARTIFACT_ROOT/dist.signature"
          test -f "$ARTIFACT_ROOT/dist.manifest.json"
          test "$(find "$ARTIFACT_ROOT" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = 'dist dist.manifest.json dist.signature '
          if find "$ARTIFACT_ROOT" ! -type d ! -type f -print -quit | grep -q .; then
            echo 'Artifact contains a non-regular filesystem entry.' >&2
            exit 1
          fi
          grep -Eq '^[0-9a-f]{64}$' "$ARTIFACT_ROOT/dist.signature"
          # Path-relative and locale-pinned so the two jobs compute it
          # identically. Covers every byte of the artifact, not just the
          # signature file, and is published as this job's output.
          ARTIFACT_DIGEST="$(cd "$ARTIFACT_ROOT" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d ' ' -f 1)"
          echo "artifact-digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          rm -rf packages/admin-surface/dist
          cp -a "$ARTIFACT_ROOT/dist" packages/admin-surface/dist
          cp "$ARTIFACT_ROOT/dist.signature" packages/admin-surface/dist.signature
          cp "$ARTIFACT_ROOT/dist.manifest.json" packages/admin-surface/dist.manifest.json

      # dist.markers.json — the source-contract assertions this re-checks — is
      # NOT in the artifact: it comes from the pinned checkout, so the claims
      # are trusted even though the bundle they are checked against is not.
      - name: Verify the acceptance manifest describes those bytes
        run: php bin/admin-dist-acceptance verify

  publish:
    name: Publish rebuilt admin dist
    needs: [build, validate]
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download isolated build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admin-dist
          path: ${{ runner.temp }}/admin-dist

      # Structural, shell-only re-validation of the downloaded tree. This job
      # holds the write token, so it runs no PHP, no Composer and no
      # third-party action beyond checkout/download-artifact (#2704) — the
      # acceptance manifest was already verified against these exact bytes by
      # `validate`, which this job `needs`, so a failed verification can never
      # reach a write.
      #
      # "These exact bytes" is proven, not assumed: the digest below is
      # re-derived here and compared against the one `validate` published as a
      # job output. Selecting an artifact by name alone would let this job
      # install something other than what was blessed; the comparison makes
      # the two provably the same artifact, and it fails closed because an
      # absent or mismatched digest aborts before any copy. That keeps the
      # manifest that lands here the one verified beside this dist (#2524).
      - name: Structurally validate and install generated public artifacts
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/admin-dist
          VALIDATED_DIGEST: ${{ needs.validate.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -d "$ARTIFACT_ROOT/dist"
          test -f "$ARTIFACT_ROOT/dist.signature"
          test -f "$ARTIFACT_ROOT/dist.manifest.json"
          test "$(find "$ARTIFACT_ROOT" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = 'dist dist.manifest.json dist.signature '
          if find "$ARTIFACT_ROOT" ! -type d ! -type f -print -quit | grep -q .; then
            echo 'Artifact contains a non-regular filesystem entry.' >&2
            exit 1
          fi
          grep -Eq '^[0-9a-f]{64}$' "$ARTIFACT_ROOT/dist.signature"
          if [ -z "$VALIDATED_DIGEST" ]; then
            echo 'The validate job published no artifact digest; refusing to publish unverified bytes.' >&2
            exit 1
          fi
          ARTIFACT_DIGEST="$(cd "$ARTIFACT_ROOT" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d ' ' -f 1)"
          if [ "$ARTIFACT_DIGEST" != "$VALIDATED_DIGEST" ]; then
            echo "Artifact ${ARTIFACT_DIGEST} is not the artifact ${VALIDATED_DIGEST} that was verified." >&2
            exit 1
          fi
          rm -rf packages/admin-surface/dist
          cp -a "$ARTIFACT_ROOT/dist" packages/admin-surface/dist
          cp "$ARTIFACT_ROOT/dist.signature" packages/admin-surface/dist.signature
          cp "$ARTIFACT_ROOT/dist.manifest.json" packages/admin-surface/dist.manifest.json

      - name: Commit rebuilt dist to the Dependabot branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add packages/admin-surface/dist/ packages/admin-surface/dist.signature packages/admin-surface/dist.manifest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(admin-surface): rebuild dist for dependency update'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push origin "HEAD:${HEAD_REF}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push does not emit another pull_request synchronize run.
      - name: Dispatch blocking CI for rebuilt branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
