name: Cut Release

# Canonical release path (#1385). Replaces the manual scripts/release.sh
# ritual: validate, mutate CHANGELOG, commit, tag, push — all in CI.
#
# Trigger via the GitHub Actions UI ("Run workflow") or `gh workflow run`:
#
#   gh workflow run release-cut.yml -f version=v0.1.0-alpha.172
#
# Mirrors scripts/release.sh checks (semver regex, [Unreleased] non-empty,
# tag must not exist, monorepo shape) but eliminates the interactive
# `gh release create` prompt — `.github/workflows/split.yml` already
# creates the GitHub Release in its `publish-github-release` job.
#
# RELEASE GATE (alpha.200–202 red-at-tag post-mortem): a tag cannot be
# created unless the repository's proofs are green on the EXACT commit being
# tagged. Four gates enforce this:
#   Gate 1 — the release base (main HEAD) must already have green CI;
#   Gate 2 — the release commit itself is pushed to a throwaway branch
#            (release-cut/<version>) and ci.yml is dispatched on it;
#   Gate 3 — Release Readiness (release.yml) is dispatched on that same exact
#            SHA: candidate build plus the full Playwright sweep. release.yml
#            accepts a release-cut/* gate tip so it can verify the commit
#            BEFORE main advances;
#   Gate 4 — the complete inventory is replayed in random order in ONE
#            unsharded process. ci/random-order shards for wall-clock, and a
#            shard only randomises within itself, so the sharded proof cannot
#            see a cross-shard ordering dependency. A tag is cheap to gate and
#            expensive to retract.
# Only after all four does main fast-forward to the gated SHA and the tag push
# in one atomic push.
# Failure recovery is clean by construction: if either gate fails, main is
# untouched and no tag exists — fix the problem and re-run the cut with the
# same version. The gate branch is deleted on the way out either way.
#
# TWO IDENTITIES, deliberately:
#
#   SPLIT_GITHUB_TOKEN  — checkout, gate-branch push, workflow dispatches, and
#                         gate-branch cleanup. The existing PAT split.yml uses.
#   Waaseyaa Release Bot — the final atomic main + tag push ONLY, via a fresh
#                         installation token minted immediately before it.
#
# Neither may be the built-in `GITHUB_TOKEN`: pushes made with it do not trigger
# downstream workflows, so split.yml and packagist-update.yml would silently
# never fire and the release would tag without publishing.
#
# The App exists because `main-protection` requires pull requests for
# refs/heads/main and its only role-based bypass is bypass_mode "pull_request",
# so no direct push is permitted for anyone. The cut MUST push the gated commit
# to main directly: the design tags the EXACT four-gate-tested SHA, and every
# GitHub merge mode (squash, rebase, merge commit) would rewrite it, which would
# mean tagging a commit no gate ever ran against. The App is scoped to this one
# repository with Contents:write + Actions:write and is the only actor holding
# `always` bypass. Installation tokens expire after one hour, and Gates 2-4
# routinely exceed that, so the token is minted at the point of use.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0-alpha.172)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut release tag ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify SPLIT_GITHUB_TOKEN secret
        env:
          SPLIT_GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: |
          if [ -z "${SPLIT_GH_TOKEN}" ]; then
            echo "::error::SPLIT_GITHUB_TOKEN secret is not configured."
            echo "::error::Without a PAT, downstream workflows (split.yml,"
            echo "::error::packagist-update.yml) will NOT fire on the tag push."
            exit 1
          fi

      - name: Verify release-identity App credentials
        # Fail fast. Without this the missing secret only surfaces at the very
        # last step, after Gates 2-4 have burned the better part of an hour.
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RELEASE_APP_ID}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not configured."
            echo "::error::The final atomic push to main is made by the Waaseyaa Release Bot App,"
            echo "::error::the only actor with 'always' bypass on the main-protection ruleset."
            echo "::error::Without it the push is refused by repository rule (GH013) after every gate has run."
            exit 1
          fi

      - name: Validate version shape
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::version must match vX.Y.Z or vX.Y.Z-prerelease.N (got: $VERSION)"
            exit 1
          fi
          echo "::notice::Version $VERSION accepted."

      - name: Guard against unauthorized v1.0 tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == v1.0* ]]; then
            # Same guard as split.yml runs after the fact — fail HERE so the
            # tag never gets created without owner approval.
            if [ ! -f "release-approvals/v1.0.approved" ]; then
              # We haven't checked out yet, but the path is in the repo at HEAD.
              echo "::error::UNAUTHORIZED_V1_TAG: cannot cut $VERSION without release-approvals/v1.0.approved on main."
              echo "::error::See VERSIONING.md for the v1.0 approval process."
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          # Use PAT so subsequent push triggers downstream workflows
          # (split.yml, packagist-update.yml).
          token: ${{ secrets.SPLIT_GITHUB_TOKEN }}

      - name: Set up PHP
        # This job runs PHP directly (bin/check-changelog-shape,
        # bin/sync-internal-versions, the random-order proof below) and had NO
        # setup-php step, relying on whatever ubuntu-latest happened to ship.
        # A stale comment further down claimed one ran "above". Pin it to the
        # same 8.5 + extension set every other release workflow provisions, so
        # the cut cannot silently run on a different interpreter than the CI
        # that gated it.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Re-check v1.0 approval against checked-out tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == v1.0* ]] && [ ! -f "release-approvals/v1.0.approved" ]; then
            echo "::error::UNAUTHORIZED_V1_TAG: release-approvals/v1.0.approved missing on main."
            exit 1
          fi

      - name: "Gate 1/4: require green CI on the release base (main HEAD)"
        # Fail fast before mutating anything if main is red — this is how the
        # b1 interface stub and the integration-test misses rode into tagged
        # releases (alpha.201/202). Waits out an in-flight run.
        env:
          GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: bash bin/wait-for-green-ci "$(git rev-parse HEAD)" 1800

      - name: Verify monorepo release shape
        run: bash bin/check-monorepo-release-shape HEAD

      - name: Verify root require / split parity
        # Pre-tag structural gate: every waaseyaa/* in the root composer.json
        # require list must have a split.yml matrix entry AND an existing split
        # repo. This is the gate that would have caught the alpha.189 break —
        # the root meta required waaseyaa/{agent-output,audit,page-builder} with
        # no split target and no Packagist registration, producing a published
        # but uninstallable release. Runs BEFORE the tag is cut, so the poisoned
        # tag is never created (the existing tag-parity check can only run after
        # the split, once the poison has already shipped to Packagist).
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: bash bin/check-release-require-parity

      - name: Verify tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::tag $VERSION already exists on origin"
            exit 1
          fi
          echo "::notice::Tag $VERSION is available."

      - name: Verify CHANGELOG [Unreleased] has content
        run: |
          php bin/check-changelog-shape
          unreleased=$(sed -n '/^## \[Unreleased\]/,/^## \[/{/^## \[/d;/^$/d;/^### /d;p;}' CHANGELOG.md)
          if [ -z "$unreleased" ]; then
            echo "::error::[Unreleased] section has no entries — add bullets before cutting a release"
            exit 1
          fi
          echo "::notice::[Unreleased] has content."

      - name: Install dependencies
        # Must run BEFORE the version sweep: the S1 dependency-authority
        # regeneration below builds an installed artifact and needs vendor/,
        # and Gate 4 later runs PHPUnit from the same tree. This job previously
        # installed nothing because it only did git orchestration.
        uses: ./.github/actions/composer-install-retry
        with:
          args: '--no-interaction --prefer-dist --no-progress'

      - name: Sync internal waaseyaa/* version constraints
        # bin/sync-internal-versions is produced by WP01 (composer-internal-version-sweep).
        # The script is pure PHP (no composer autoloader required) — only `php` is
        # needed, provisioned by the explicit "Set up PHP" step above.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strip the leading 'v' (release-cut input is 'vX.Y.Z[-pre]'; sync expects bare semver)
          SEMVER="${VERSION#v}"
          bin/sync-internal-versions "$SEMVER"

      - name: Mutate CHANGELOG and VERSION, capture tag message
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          semver="${VERSION#v}"
          today=$(date -u +%Y-%m-%d)
          # Stamp the VERSION file to match the tag being cut. It had drifted
          # (frozen at an early alpha) because no cut step ever wrote it, so a
          # cold clone misreported its version. Writing it here keeps VERSION in
          # lockstep with the tag from this release forward. The value is bare
          # semver (no leading 'v'), matching the file's existing format.
          printf '%s\n' "$semver" > VERSION
          # Capture content for the tag message before mutation.
          tag_msg=$(sed -n '/^## \[Unreleased\]/,/^## \[/{/^## \[Unreleased\]/d;/^## \[/d;p;}' CHANGELOG.md)
          # Rename [Unreleased] → [X.Y.Z] - DATE, insert fresh [Unreleased].
          sed -i "s/^## \[Unreleased\]/## [${semver}] - ${today}/" CHANGELOG.md
          sed -i "/^## \[${semver}\] - ${today}/i\\## [Unreleased]\\n" CHANGELOG.md
          # Stash tag_msg via heredoc-safe delimiter for downstream step.
          {
            echo "tag_msg<<RELEASE_TAG_MSG_EOF"
            echo "$tag_msg"
            echo "RELEASE_TAG_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the S1 dependency-byte authority for the swept tree
        # bin/sync-internal-versions rewrites every packages/*/composer.json
        # internal constraint (70 files for alpha.294), which changes the exact
        # package bytes the S1 artifact contracts digest. The recorded authority
        # in support/s1-sqlite-dependency-bytes.json then no longer matches, and
        # BOTH S1SqliteTopologyContractTest::exact_candidate_contract_survives_an_installed_artifact_boundary
        # and S1SchemaAuthorityContractTest::exact_installed_artifact_reproduces_the_schema_authority_contract_offline
        # fail on the release commit, taking Gate 2 down with them.
        #
        # This is not a version-sweep bug and not a gate bug: the sweep is
        # supposed to change those bytes, and the gate is supposed to notice.
        # The release commit simply has to carry the regenerated authority. The
        # alpha.294 attempt (run 32081734087) was the first cut since these
        # contracts landed, which is why no earlier release hit it.
        #
        # Runs AFTER the sweep and after VERSION is stamped, so the authority is
        # computed from the exact bytes being tagged. The regenerated file must
        # also be COMMITTED: the schema contract "refuses dirty package, lock,
        # dependency-authority, or probe bytes", so regenerating without staging
        # fails a different way. See the git add list below.
        run: bash tests/PackagedForm/check-s1-sqlite-artifact --write-dependency-authority

      - name: Commit release and push the gate branch
        id: relcommit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CRITICAL: stage every file mutated by the internal-version sync:
          # package manifests, the create-project skeleton, and copied path-
          # package metadata in the root lock. Omitting any one creates a tag
          # whose manifests disagree with its install or consumer metadata.
          # See alpha.178 (unstaged packages) and alpha.287 gate attempt 1
          # (unstaged skeleton and stale root-lock metadata).
          git add CHANGELOG.md VERSION composer.lock packages/*/composer.json skeleton/composer.json support/s1-sqlite-dependency-bytes.json
          git commit -m "chore: release ${VERSION}"
          # The release commit goes to a throwaway gate branch FIRST. Main is
          # only fast-forwarded after Gate 2 proves CI green on this exact SHA.
          git push --force origin "HEAD:refs/heads/release-cut/${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Gate 2/4: require green CI on the exact commit being tagged"
        env:
          GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.relcommit.outputs.sha }}
        run: |
          # ci.yml only auto-runs on pushes to main, so dispatch it on the
          # gate branch explicitly (ci.yml has a workflow_dispatch trigger
          # for exactly this).
          gh workflow run ci.yml --ref "release-cut/${VERSION}"
          bash bin/wait-for-green-ci "$RELEASE_SHA" 2700

      - name: "Gate 3/4: require green Release Readiness on the exact commit"
        # ci.yml proves the suite; Release Readiness additionally builds the
        # candidate and runs the full Playwright sweep. Before this gate the
        # cut ignored it entirely, so a release could be tagged without the
        # strongest proof the repository has. release.yml accepts a
        # release-cut/* gate tip precisely so it can verify this commit before
        # main advances.
        env:
          GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.relcommit.outputs.sha }}
        run: |
          gh workflow run release.yml --ref "release-cut/${VERSION}" -f sha="$RELEASE_SHA"
          bash bin/wait-for-green-ci "$RELEASE_SHA" 3600 release.yml

      - name: "Gate 4/4: complete unsharded random-order proof on the release commit"
        # ci/random-order shards the complete inventory for wall-clock. A tag is
        # cheap to gate and expensive to retract, so the release commit also gets
        # the whole inventory in ONE process: sharding is the thing most likely
        # to hide a cross-test ordering dependency, because each shard only ever
        # randomises within itself. The tree checked out here IS the release
        # commit, so this proves the exact bytes being tagged.
        run: |
          set -euo pipefail
          php bin/test-random-order | tee /tmp/random-order-proof.log
          {
            echo "### Unsharded random-order proof"
            echo
            echo '```'
            grep -E 'Replay:|seed' /tmp/random-order-proof.log | head -5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint the release-identity token
        # Minted HERE, immediately before the only push that needs it, NOT at
        # job start: App installation tokens expire after one hour and Gates
        # 2-4 routinely exceed that (the alpha.294 attempt spent ~28 minutes in
        # Gate 3 alone). A token minted earlier would be expired by now.
        #
        # The `main-protection` ruleset requires pull requests for refs/heads/main
        # and its only bypass actor is a repository role with bypass_mode
        # "pull_request", i.e. bypass via PR, never a direct push. The release cut
        # must push the gated commit to main directly, because the whole design
        # rests on tagging the EXACT four-gate-tested SHA and every GitHub merge
        # mode would rewrite it. The Waaseyaa Release Bot App is the only actor
        # granted `always` bypass, scoped to this repository.
        #
        # Deliberately NOT the built-in GITHUB_TOKEN: pushes made with it do not
        # trigger downstream workflows, which would silently break split.yml and
        # packagist-update.yml fan-out — the exact failure this workflow's
        # SPLIT_GITHUB_TOKEN comment already warns about.
        id: release_identity
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Tag the gated commit and fast-forward main (atomic)
        env:
          VERSION: ${{ inputs.version }}
          TAG_MSG: ${{ steps.changelog.outputs.tag_msg }}
          RELEASE_TOKEN: ${{ steps.release_identity.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git tag -a "$VERSION" -m "Release ${VERSION}

          ${TAG_MSG}"

          # Push as the release App. actions/checkout installed an
          # http.extraheader credential for SPLIT_GITHUB_TOKEN, which would
          # otherwise win over any remote URL credentials, so the header is
          # overridden for this single command rather than rewritten globally.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)"

          # Atomic: main fast-forward + tag land together or not at all.
          set +e
          push_output=$(git -c http.extraheader="$auth_header" \
            push --atomic origin "HEAD:refs/heads/main" "refs/tags/${VERSION}" 2>&1)
          push_status=$?
          set -e
          printf '%s\n' "$push_output"

          if [ "$push_status" -ne 0 ]; then
            # Three distinct causes, three distinct diagnostics. The previous
            # single message asserted "main likely advanced" for every failure,
            # which actively misdirected the alpha.294 investigation: main had
            # not moved at all, the push was refused by a repository rule.
            if printf '%s' "$push_output" | grep -qE 'GH013|rule violations'; then
              echo "::error::RULESET_REJECTED: refs/heads/main refused the release push by repository rule."
              echo "::error::main was NOT advanced and no tag was created."
              echo "::error::The release identity must hold 'always' bypass on the main ruleset."
              echo "::error::Check https://github.com/${REPO}/rules?ref=refs%2Fheads%2Fmain and that"
              echo "::error::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY point at the installed release App."
            elif printf '%s' "$push_output" | grep -qiE 'non-fast-forward|fetch first|behind its remote'; then
              echo "::error::MAIN_ADVANCED: main moved while the gates ran, so the fast-forward was refused."
              echo "::error::Nothing is tagged and main is untouched. Re-run the cut against the new main."
            else
              echo "::error::PUSH_REJECTED: the atomic push failed for a reason above."
              echo "::error::Nothing is tagged and main is untouched. Read the git output before re-running."
            fi
            exit 1
          fi
          echo "::notice::Pushed main + tag $VERSION to origin (four-gate-tested at $(git rev-parse HEAD))."

      - name: Clean up gate branch
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin --delete "refs/heads/release-cut/${VERSION}" || true

      - name: Summarize next steps
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo "- Tag: https://github.com/${REPO}/releases/tag/${VERSION}"
            echo "- Split runs: https://github.com/${REPO}/actions/workflows/split.yml"
            echo "- Packagist publish: https://github.com/${REPO}/actions/workflows/packagist-update.yml"
            echo
            echo "Downstream workflows fire automatically on the tag push."
          } >> "$GITHUB_STEP_SUMMARY"
