name: Cut Release

# Canonical release path (#1385). Replaces the manual scripts/release.sh
# ritual: validate, mutate CHANGELOG, commit, tag, push — all in CI.
#
# Trigger via the GitHub Actions UI ("Run workflow") or `gh workflow run`:
#
#   gh workflow run release-cut.yml -f version=v0.1.0-alpha.172
#
# Mirrors scripts/release.sh checks (semver regex, [Unreleased] non-empty,
# tag must not exist, monorepo shape) but eliminates the interactive
# `gh release create` prompt — `.github/workflows/split.yml` already
# creates the GitHub Release in its `publish-github-release` job.
#
# RELEASE GATE (alpha.200–202 red-at-tag post-mortem): a tag cannot be
# created unless the CI workflow is green on the EXACT commit being tagged.
# Two gates enforce this:
#   Gate 1 — the release base (main HEAD) must already have green CI;
#   Gate 2 — the release commit itself is pushed to a throwaway branch
#            (release-cut/<version>), ci.yml is dispatched on it, and the
#            tag is only created after that run concludes green. Main is
#            then fast-forwarded to the gated SHA and the tag pushed in one
#            atomic push.
# Failure recovery is clean by construction: if either gate fails, main is
# untouched and no tag exists — fix the problem and re-run the cut with the
# same version. The gate branch is deleted on the way out either way.
#
# Push uses SPLIT_GITHUB_TOKEN (the existing PAT used by split.yml to fan
# out to per-package repos). This is required because tags pushed by the
# default `GITHUB_TOKEN` do NOT trigger downstream workflows
# (split.yml + packagist-update.yml), and the whole point of automating
# this is to keep the existing pipeline firing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0-alpha.172)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut release tag ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify SPLIT_GITHUB_TOKEN secret
        env:
          SPLIT_GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: |
          if [ -z "${SPLIT_GH_TOKEN}" ]; then
            echo "::error::SPLIT_GITHUB_TOKEN secret is not configured."
            echo "::error::Without a PAT, downstream workflows (split.yml,"
            echo "::error::packagist-update.yml) will NOT fire on the tag push."
            exit 1
          fi

      - name: Validate version shape
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::version must match vX.Y.Z or vX.Y.Z-prerelease.N (got: $VERSION)"
            exit 1
          fi
          echo "::notice::Version $VERSION accepted."

      - name: Guard against unauthorized v1.0 tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == v1.0* ]]; then
            # Same guard as split.yml runs after the fact — fail HERE so the
            # tag never gets created without owner approval.
            if [ ! -f "release-approvals/v1.0.approved" ]; then
              # We haven't checked out yet, but the path is in the repo at HEAD.
              echo "::error::UNAUTHORIZED_V1_TAG: cannot cut $VERSION without release-approvals/v1.0.approved on main."
              echo "::error::See VERSIONING.md for the v1.0 approval process."
              exit 1
            fi
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # Use PAT so subsequent push triggers downstream workflows
          # (split.yml, packagist-update.yml).
          token: ${{ secrets.SPLIT_GITHUB_TOKEN }}

      - name: Re-check v1.0 approval against checked-out tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == v1.0* ]] && [ ! -f "release-approvals/v1.0.approved" ]; then
            echo "::error::UNAUTHORIZED_V1_TAG: release-approvals/v1.0.approved missing on main."
            exit 1
          fi

      - name: "Gate 1/2: require green CI on the release base (main HEAD)"
        # Fail fast before mutating anything if main is red — this is how the
        # b1 interface stub and the integration-test misses rode into tagged
        # releases (alpha.201/202). Waits out an in-flight run.
        env:
          GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: bash bin/wait-for-green-ci "$(git rev-parse HEAD)" 1800

      - name: Verify monorepo release shape
        run: bash bin/check-monorepo-release-shape HEAD

      - name: Verify root require / split parity
        # Pre-tag structural gate: every waaseyaa/* in the root composer.json
        # require list must have a split.yml matrix entry AND an existing split
        # repo. This is the gate that would have caught the alpha.189 break —
        # the root meta required waaseyaa/{agent-output,audit,page-builder} with
        # no split target and no Packagist registration, producing a published
        # but uninstallable release. Runs BEFORE the tag is cut, so the poisoned
        # tag is never created (the existing tag-parity check can only run after
        # the split, once the poison has already shipped to Packagist).
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
        run: bash bin/check-release-require-parity

      - name: Verify tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::tag $VERSION already exists on origin"
            exit 1
          fi
          echo "::notice::Tag $VERSION is available."

      - name: Verify CHANGELOG [Unreleased] has content
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::no [Unreleased] section in CHANGELOG.md"
            exit 1
          fi
          unreleased=$(sed -n '/^## \[Unreleased\]/,/^## \[/{/^## \[/d;/^$/d;/^### /d;p;}' CHANGELOG.md)
          if [ -z "$unreleased" ]; then
            echo "::error::[Unreleased] section has no entries — add bullets before cutting a release"
            exit 1
          fi
          echo "::notice::[Unreleased] has content."

      - name: Sync internal waaseyaa/* version constraints
        # bin/sync-internal-versions is produced by WP01 (composer-internal-version-sweep).
        # The script is pure PHP (no composer autoloader required) — only `php` is
        # needed, which is standard on ubuntu-latest after the setup-php steps above.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strip the leading 'v' (release-cut input is 'vX.Y.Z[-pre]'; sync expects bare semver)
          SEMVER="${VERSION#v}"
          bin/sync-internal-versions "$SEMVER"

      - name: Mutate CHANGELOG and VERSION, capture tag message
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          semver="${VERSION#v}"
          today=$(date -u +%Y-%m-%d)
          # Stamp the VERSION file to match the tag being cut. It had drifted
          # (frozen at an early alpha) because no cut step ever wrote it, so a
          # cold clone misreported its version. Writing it here keeps VERSION in
          # lockstep with the tag from this release forward. The value is bare
          # semver (no leading 'v'), matching the file's existing format.
          printf '%s\n' "$semver" > VERSION
          # Capture content for the tag message before mutation.
          tag_msg=$(sed -n '/^## \[Unreleased\]/,/^## \[/{/^## \[Unreleased\]/d;/^## \[/d;p;}' CHANGELOG.md)
          # Rename [Unreleased] → [X.Y.Z] - DATE, insert fresh [Unreleased].
          sed -i "s/^## \[Unreleased\]/## [${semver}] - ${today}/" CHANGELOG.md
          sed -i "/^## \[${semver}\] - ${today}/i\\## [Unreleased]\\n" CHANGELOG.md
          # Stash tag_msg via heredoc-safe delimiter for downstream step.
          {
            echo "tag_msg<<RELEASE_TAG_MSG_EOF"
            echo "$tag_msg"
            echo "RELEASE_TAG_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit release and push the gate branch
        id: relcommit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CRITICAL: also stage the packages/*/composer.json files mutated by the
          # earlier "Sync internal waaseyaa/* version constraints" step. Forgetting
          # this leaves the synced files dirty in the runner and they're discarded
          # on shutdown — the resulting tag commit only promotes CHANGELOG, every
          # internal `waaseyaa/*` constraint still points at the prior version,
          # and the next pre-push composer-policy gate fails with 200+ CP-NEW
          # violations. See incident: alpha.178 cut on 2026-05-14.
          git add CHANGELOG.md VERSION packages/*/composer.json
          git commit -m "chore: release ${VERSION}"
          # The release commit goes to a throwaway gate branch FIRST. Main is
          # only fast-forwarded after Gate 2 proves CI green on this exact SHA.
          git push --force origin "HEAD:refs/heads/release-cut/${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Gate 2/2: require green CI on the exact commit being tagged"
        env:
          GH_TOKEN: ${{ secrets.SPLIT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.relcommit.outputs.sha }}
        run: |
          # ci.yml only auto-runs on pushes to main, so dispatch it on the
          # gate branch explicitly (ci.yml has a workflow_dispatch trigger
          # for exactly this).
          gh workflow run ci.yml --ref "release-cut/${VERSION}"
          bash bin/wait-for-green-ci "$RELEASE_SHA" 2700

      - name: Tag the gated commit and fast-forward main (atomic)
        env:
          VERSION: ${{ inputs.version }}
          TAG_MSG: ${{ steps.changelog.outputs.tag_msg }}
        run: |
          git tag -a "$VERSION" -m "Release ${VERSION}

          ${TAG_MSG}"
          # Atomic: main fast-forward + tag land together or not at all. A
          # non-FF rejection means main advanced while the gate ran — nothing
          # is tagged; re-run the cut against the new main.
          if ! git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${VERSION}"; then
            echo "::error::Atomic push of main + tag rejected (main likely advanced during the gate)."
            echo "::error::No tag was created and main is untouched. Re-run the cut."
            exit 1
          fi
          echo "::notice::Pushed main + tag $VERSION to origin (CI-gated at $(git rev-parse HEAD))."

      - name: Clean up gate branch
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin --delete "refs/heads/release-cut/${VERSION}" || true

      - name: Summarize next steps
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo "- Tag: https://github.com/${REPO}/releases/tag/${VERSION}"
            echo "- Split runs: https://github.com/${REPO}/actions/workflows/split.yml"
            echo "- Packagist publish: https://github.com/${REPO}/actions/workflows/packagist-update.yml"
            echo
            echo "Downstream workflows fire automatically on the tag push."
          } >> "$GITHUB_STEP_SUMMARY"
