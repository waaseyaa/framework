openapi: "3.1.0"
info:
  title: "Waaseyaa agent-run streaming and approval API"
  version: "0.1.0"
  description: >
    Hand-maintained subset for agent-run messages on the shared broadcast stream
    and approval decisions. This is not the full Framework API.
    The consuming application supplies the origin and authentication session.
  contact:
    name: "Waaseyaa Framework maintainers"
    url: "https://github.com/waaseyaa/framework/issues"

servers:
  - url: /
    description: "Consuming application's origin; paths are relative to its root."

tags:
  - name: Agent runs
    description: "Agent-run lifecycle messages and human approval decisions."

paths:
  /broadcast:
    get:
      operationId: streamAgentRunEvents
      tags: [Agent runs]
      summary: "Subscribe to agent-run messages on the shared SSE stream"
      description: >
        Requires an authenticated session. Subscribe with channels=agent.run.{id}.
        Channel selection follows the shared broadcast ACL; this endpoint does
        not perform the approval controller's per-run ownership check.
        SSE frames contain id, event and data lines. Message data is the complete
        broadcast-log row, with the agent payload nested inside its data field.
        The stream also sends connected and error control frames and may carry
        other channels; x-agent-run-event-schema describes only agent-run rows.
        No pending_approval event is currently emitted by the runtime.
      parameters:
        - name: channels
          in: query
          description: >
            Comma-separated channel names. Select agent.run.{id} for a run.
            Omission uses the shared broadcast default and its existing ACL.
          schema:
            type: string
          example: "agent.run.aebfef20-ae10-4a15-b54c-4eb234ec6a66"
        - name: Last-Event-ID
          in: header
          description: "Broadcast-log cursor for reconnecting clients."
          schema:
            type: integer
      responses:
        "200":
          description: "Bounded SSE connection; clients reconnect to resume."
          content:
            text/event-stream:
              schema:
                type: string
              x-agent-run-event-schema:
                $ref: "#/components/schemas/AgentRunEvent"
        "401":
          description: "Unauthenticated"
        "503":
          description: "Broadcast storage unavailable or concurrent-stream cap reached"

  /api/ai/agent/run/{id}/approve:
    post:
      operationId: resolveAgentRunApproval
      tags: [Agent runs]
      summary: "Approve or deny a pending destructive tool call"
      description: >
        Requires an authenticated session, agent.run.approve permission and
        update access to this run. Both decisions use this endpoint.
        call_id must match the persisted pending_approval_call_id.
        Approval resumes the run; denial fails it with approval_denied.
        An accepted decision emits approval_resolved with call_id and decision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "204":
          description: "Decision accepted; no response body"
        "400":
          description: "Malformed JSON or invalid call_id/decision"
        "401":
          description: "Unauthenticated"
        "403":
          description: "Missing permission or update access to the run"
        "404":
          description: "Run not found or not awaiting approval"
        "409":
          description: "call_id mismatch or concurrent run-state change"

components:
  schemas:
    AgentRunEvent:
      type: object
      description: >
        JSON data of a broadcast message on agent.run.{id}, as returned by
        BroadcastStorage::poll and framed by BroadcastRouter. AgentRunBroadcaster
        places run_id in data. Other lifecycle payload fields vary by producer;
        cancellation may carry cancelled_at or reaper error fields.
      required: [id, channel, event, data, created_at]
      properties:
        id:
          type: integer
          description: "Broadcast-log sequence cursor."
        channel:
          type: string
          pattern: '^agent\.run\.'
        event:
          type: string
          enum: [run_started, run_completed, run_failed, run_cancelled, approval_resolved]
        data:
          type: object
          required: [run_id]
          properties:
            run_id:
              type: string
              format: uuid
          additionalProperties: true
        created_at:
          type: number
          description: "Unix timestamp in seconds, including fractional seconds."
      allOf:
        - if:
            properties:
              event:
                const: approval_resolved
            required: [event]
          then:
            properties:
              data:
                $ref: "#/components/schemas/AgentRunApprovalResolvedPayload"

    AgentRunApprovalResolvedPayload:
      type: object
      description: "Payload emitted by AgentRunController after an accepted decision."
      required: [run_id, call_id, decision]
      properties:
        run_id:
          type: string
          format: uuid
        call_id:
          type: string
          pattern: '[^ \t\n\r\x00\x0B]'
        decision:
          type: string
          enum: [approve, deny]

    ApprovalRequest:
      type: object
      description: "Decision body for the shared approve/deny endpoint."
      required: [call_id, decision]
      properties:
        call_id:
          type: string
          pattern: '[^ \t\n\r\x00\x0B]'
          description: >
            Must be non-empty after PHP trim and match the persisted
            pending_approval_call_id. The pattern uses PHP trim's character set.
        decision:
          type: string
          enum: [approve, deny]
