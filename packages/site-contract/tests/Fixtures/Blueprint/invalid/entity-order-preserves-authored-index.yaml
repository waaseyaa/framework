schema: waaseyaa.site
version: 1
generator_version: 1
application:
  name: Complete Blueprint Application
  id: complete-blueprint
  canonical_origin:
    config_key: APP_ORIGIN
framework:
  revision_policy: exact-lock
  observed_lock_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
content_types:
  - id: article
    canonical_route: /articles/{slug}
capabilities:
  - id: payments
    state: not_needed
    reason: Payments are outside this application.
personal_data_stores: []
recipes: []
verification:
  command: bin/maintenance/site-verify
application_blueprint:
  contract_version: 1
  entities:
    - id: person
      label: Person
      storage: sql-blob
      revisionable: false
      translatable: false
      keys:
        id: id
        uuid: uuid
        label: name
      fields:
        - id: name
          type: string
          required: true
    - id: article
      label: Article
      storage: sql-column
      revisionable: true
      translatable: false
      keys:
        id: id
        uuid: uuid
        label: title
        revision: vid
        owner: author
      fields:
        - id: title
          type: string
          required: true
          indexed: true
        - id: status
          type: enum
          values: [draft, final]
  relationships: []
  permissions: []
  roles: []
  policies: []
  workflows: []
  fixtures: []
  checks: []
