schema: waaseyaa.site
version: 1
generator_version: 1
application:
  name: Minimal Blueprint Application
  id: minimal-blueprint
  canonical_origin:
    config_key: APP_ORIGIN
framework:
  revision_policy: exact-lock
  observed_lock_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
content_types:
  - id: article
    canonical_route: /articles/{slug}
capabilities:
  - id: payments
    state: not_needed
    reason: Payments are outside this application.
personal_data_stores: []
recipes: []
verification:
  command: bin/maintenance/site-verify
application_blueprint:
  contract_version: 1
  entities:
    - id: article
      label: Article
      storage: sql-blob
      revisionable: false
      translatable: false
      keys:
        id: id
        uuid: uuid
        label: title
      fields:
        - id: title
          type: string
  relationships: []
  permissions:
    - id: use editorial transition publish
      title: Publish articles
  roles: []
  policies: []
  workflows:
    - id: editorial
      label: Editorial
      initial_state: draft
      states:
        - { id: draft, label: Draft, published: false }
        - { id: published, label: Published, published: true }
      transitions:
        - { id: publish, label: Publish, from: [draft], to: published, permission: use editorial transition publish }
      bindings:
        - { entity: article }
  fixtures: []
  checks: []
