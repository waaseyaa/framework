pre-commit:
  parallel: true
  commands:
    php-cs:
      glob: "*.php"
      run: composer cs-check

pre-push:
  parallel: true
  commands:
    composer-policy:
      run: php bin/check-composer-policy
    spec-drift:
      run: bash tools/drift-detector.sh origin/main
    phpstan:
      glob: "*.php"
      run: composer phpstan
    phpunit:
      glob: "*.php"
      # Project requires PHP 8.5+ (see CLAUDE.md §Code Style and package
      # composer.json platform constraints). If the contributor's local PHP
      # is older, the test suite cannot bootstrap (e.g. array_first() is
      # PHP-8.5-only). Skip with a clear warning rather than false-failing —
      # the gate runs in CI on the mandatory PHP 8.5 matrix.
      run: |
        PHP_OK=$(php -r 'echo PHP_VERSION_ID >= 80500 ? 1 : 0;')
        if [ "$PHP_OK" != "1" ]; then
          echo "phpunit skipped: local PHP $(php -r 'echo PHP_VERSION;') < required 8.5; CI matrix is authoritative."
          exit 0
        fi
        # Fast stale-vendor pre-check: a local vendor/ out of sync with
        # composer.lock/composer.json makes the Unit suite fail with hundreds of
        # cryptic "Class ... not found" errors that look like test drift. Fail
        # fast here with one actionable line so the full-Unit hook is never
        # bypassed with --no-verify over a stale checkout. Local-dev only.
        php bin/check-vendor-fresh || exit 1
        php -d memory_limit=512M ./vendor/bin/phpunit --testsuite Unit --no-progress --no-coverage
