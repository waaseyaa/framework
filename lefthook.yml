pre-commit:
  parallel: true
  commands:
    php-cs:
      glob: "*.php"
      run: composer cs-check

pre-push:
  parallel: true
  commands:
    composer-policy:
      run: bash bin/check-composer-policy
    spec-drift:
      run: tools/drift-detector.sh 5
    phpstan:
      glob: "*.php"
      run: composer phpstan
    phpunit:
      glob: "*.php"
      run: php -d memory_limit=512M ./vendor/bin/phpunit --testsuite Unit --no-progress --no-coverage
